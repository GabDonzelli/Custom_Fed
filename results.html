"Preprocessing": "DistilGPT-2 tokenizer · 64-token blocks", "Communicated per round": "147,456 weights — the LoRA adapters only"}, "status": "done", "rows": [{"round": 0, "accuracy": 0.198454, "loss": 5.09433, "clients": null, "timestamp": "2026-09-08T15:37:56.312857"}, {"round": 1, "accuracy": 0.211619, "loss": 4.908216, "clients": 7, "timestamp": "2026-09-08T15:43:13.915585"}, {"round": 2, "accuracy": 0.219623, "loss": 4.804994, "clients": 7, "timestamp": "2026-09-08T15:48:05.666136"}, {"round": 3, "accuracy": 0.22249, "loss": 4.766189, "clients": 7, "timestamp": "2026-09-08T15:52:58.066192"}, {"round": 4, "accuracy": 0.222627, "loss": 4.747071, "clients": 7, "timestamp": "2026-09-08T15:57:47.374230"}, {"round": 5, "accuracy": 0.22437, "loss": 4.735149, "clients": 7, "timestamp": "2026-09-08T16:02:33.994334"}, {"round": 6, "accuracy": 0.224118, "loss": 4.721692, "clients": 7, "timestamp": "2026-09-08T16:07:26.693543"}, {"round": 7, "accuracy": 0.223705, "loss": 4.718296, "clients": 7, "timestamp": "2026-09-08T16:12:20.097906"}, {"round": 8, "accuracy": 0.224439, "loss": 4.711734, "clients": 7, "timestamp": "2026-09-08T16:17:07.613805"}, {"round": 9, "accuracy": 0.226091, "loss": 4.702235, "clients": 7, "timestamp": "2026-09-08T16:21:50.580168"}, {"round": 10, "accuracy": 0.226045, "loss": 4.698669, "clients": 7, "timestamp": "2026-09-08T16:26:32.603799"}, {"round": 11, "accuracy": 0.225999, "loss": 4.694141, "clients": 7, "timestamp": "2026-09-08T16:31:15.593860"}, {"round": 12, "accuracy": 0.225769, "loss": 4.69366, "clients": 7, "timestamp": "2026-09-08T16:35:54.517027"}, {"round": 13, "accuracy": 0.226733, "loss": 4.685309, "clients": 7, "timestamp": "2026-09-08T16:40:38.435999"}, {"round": 14, "accuracy": 0.225815, "loss": 4.69061, "clients": 7, "timestamp": "2026-09-08T16:45:20.598496"}, {"round": 15, "accuracy": 0.225655, "loss": 4.684832, "clients": 7, "timestamp": "2026-09-08T16:50:07.576647"}, {"round": 16, "accuracy": 0.225724, "loss": 4.687104, "clients": 7, "timestamp": "2026-09-08T16:54:51.652863"}, {"round": 17, "accuracy": 0.225403, "loss": 4.679642, "clients": 7, "timestamp": "2026-09-08T16:59:39.215360"}, {"round": 18, "accuracy": 0.225655, "loss": 4.679786, "clients": 7, "timestamp": "2026-09-08T17:04:26.478635"}, {"round": 19, "accuracy": 0.227925, "loss": 4.673567, "clients": 7, "timestamp": "2026-09-08T17:09:09.198033"}, {"round": 20, "accuracy": 0.225288, "loss": 4.678619, "clients": 7, "timestamp": "2026-09-08T17:13:49.633384"}], "last_round": 20, "baseline": 0.198454, "final": 0.225288, "final_loss": 4.678619, "best": {"round": 19, "accuracy": 0.227925, "loss": 4.673567, "clients": 7, "timestamp": "2026-09-08T17:09:09.198033"}, "clients_last": 7, "client_counts": [7], "elapsed": 5753.320527}], "counts": {"done": 4, "running": 0, "interrupted": 0, "pending": 0, "planned": 0}, "state": "done"}], "planejadas": [{"label": "FedAvg puro (sem grupos)", "eixo": "Estratégia", "feito": true, "detail": "Rodado em 07/09/2026, nas 4 tarefas e nas duas frações. Como previsto pela álgebra, reproduziu as curvas agrupadas em vez de contrastar com elas — o valor da run acabou sendo medir a variância entre execuções, não testar a estratégia.", "label_en": "Plain FedAvg (no groups)", "eixo_en": "Strategy", "detail_en": "Run on 2026-09-07 across the 4 tasks and both fractions. As the algebra predicted, it reproduced the grouped curves instead of contrasting with them — the run's real value turned out to be measuring run-to-run variance, not testing the strategy."}, {"label": "Semear as runs", "eixo": "Metodologia", "feito": false, "detail": "Acrescentar <code>torch.manual_seed<\/code> na criação do modelo e nos DataLoaders. Hoje o round 0 já sai diferente entre duas runs, antes de qualquer treino, e isso contamina toda comparação. É pré-requisito para os outros itens significarem alguma coisa, então vem primeiro.", "label_en": "Seed the runs", "eixo_en": "Methodology", "detail_en": "Done on 2026-09-08. <code>torch.manual_seed<\/code> on model creation and on the DataLoaders, plus the client deriving its own seed per partition and round. Two runs of the same configuration now match to every digit."}, {"label": "Peso igual por grupo", "eixo": "Estratégia", "feito": false, "detail": "Trocar o peso grupo→global de proporcional aos exemplos para igual entre grupos. É a mudança que faz o agrupamento deixar de ser contabilidade e passar a ser método: cada grupo conta o mesmo, independentemente de quantos dados tem. Dá sentido a grupo como unidade real — região, hospital, operadora — em vez de rótulo.", "label_en": "Equal weight per group", "eixo_en": "Strategy", "detail_en": "Done on 2026-09-08. Switching the group→global weight from proportional to equal is what makes grouping stop being bookkeeping. Confirmed: up to 3.27 pp of difference across the 16 seeded runs."}, {"label": "Participação parcial 0,3", "eixo": "Participação", "feito": false, "detail": "3 de 10 clients por round, com <code>min-train-nodes = 3<\/code>. Estende o eixo que já tem 1,0 e 0,7. Com 4 grupos, metade fica vazia em boa parte dos rounds — o que só passa a importar depois do item de peso igual por grupo.", "label_en": "Partial participation 0.3", "eixo_en": "Participation", "detail_en": "3 of 10 clients per round, with <code>min-train-nodes = 3<\/code>. Extends the axis that already has 1.0 and 0.7. With 4 groups, 100% of rounds have an empty group — which only matters now that equal weighting exists."}, {"label": "LR decay", "eixo": "Otimização", "feito": false, "detail": "Branch <code>lr-decay<\/code>. Passo decrescente por round, para conter o ruído que a reamostragem de clients injeta no fim do treino. É o único eixo que muda a dinâmica de treino de verdade, então é onde há mais chance de efeito acima da régua de ruído.", "label_en": "LR decay", "eixo_en": "Optimization", "detail_en": "Branch <code>lr-decay<\/code>. A decreasing step per round, to contain the noise that client resampling injects late in training. It is the only axis that genuinely changes training dynamics."}], "planejamento": {"intro": "O plano varia <b>um eixo de cada vez<\/b> contra uma referência fixa. Tudo o mais — modelo, hiperparâmetros, particionamento, código — fica idêntico, para que a diferença observada tenha uma causa só. Desde 08/09/2026 todas as runs novas são <b>semeadas<\/b> (<code>seed = 42<\/code>): duas execuções da mesma configuração dão exatamente o mesmo resultado, então qualquer diferença entre duas simulações é da mudança, não do sorteio.", "avisos": ["<b>As runs antigas não têm semente.<\/b> As simulações marcadas <i>sem semente<\/i> foram feitas antes, e duas delas com a mesma configuração divergiam sozinhas — medimos <code>3,26 p.p.<\/code> no CIFAR-10 entre FedAvg puro e agrupado, que são o mesmo algoritmo. Elas continuam aqui porque são a régua do ruído, mas não servem para atribuir efeito a nada."], "intro_en": "The plan varies <b>one axis at a time<\/b> against a fixed reference. Everything else — model, hyperparameters, partitioning, code — stays identical, so an observed difference has a single cause. Since 2026-09-08 every new run is <b>seeded<\/b> (<code>seed = 42<\/code>): two runs of the same configuration give exactly the same result, so any difference between two simulations comes from the change, not from the draw.", "avisos_en": ["<b>The older runs have no seed.<\/b> The simulations tagged <i>NO seed<\/i> predate seeding, and two of them with the same configuration diverged on their own — we measured <code>3.26 pp<\/code> on CIFAR-10 between plain and grouped FedAvg, which are the same algorithm. They stay here as the noise ruler, but they cannot attribute an effect to anything."]}, "achados": {"intro": "O que as 30 runs deste painel mostraram, em ordem de importância para a pesquisa. Cada item foi medido, não inferido; os números vêm dos CSVs e dos logs de execução.", "intro_en": "What the 30 runs in this dashboard showed, ordered by importance to the research. Every item was measured, not inferred; the numbers come from the CSVs and the execution logs.", "itens": [{"title": "Agrupar não muda o modelo — em nenhum regime", "title_en": "Grouping does not change the model — in any regime", "body": "Com o peso grupo→global proporcional aos exemplos, a média de dois níveis <b>telescopa<\/b>: o <code>N_g<\/code> que pondera o grupo cancela com o <code>N_g<\/code> que normaliza a média dentro dele, e sobra exatamente o FedAvg puro. É a diferença entre <code>(a+b)+(c+d)<\/code> e <code>a+b+c+d<\/code> — parênteses não mudam uma soma. Verificado de três formas: pela álgebra, numericamente contra o <code>TrackedFedAvg<\/code> (diferença máxima <code>1e-16<\/code>, o epsilon de máquina em float64), e rodando o treino inteiro com a mesma semente (idêntico até a última casa, com uma única divergência de <code>1e-6<\/code> na loss, que é ordem de soma em float32). Vale inclusive com participação parcial e grupos vazios — a crença anterior de que 0,7 quebraria a identidade estava errada.", "body_en": "With the group→global weight proportional to examples, the two-level mean <b>telescopes<\/b>: the <code>N_g<\/code> weighting the group cancels the <code>N_g<\/code> normalizing the mean inside it, leaving exactly plain FedAvg. It is the difference between <code>(a+b)+(c+d)<\/code> and <code>a+b+c+d<\/code> — parentheses do not change a sum. Verified three ways: algebraically, numerically against <code>TrackedFedAvg<\/code> (max difference <code>1e-16<\/code>, float64 machine epsilon), and by running the full training with the same seed (identical to the last digit, with a single <code>1e-6<\/code> divergence in the loss, which is float32 summation order). It holds under partial participation and empty groups too — the earlier belief that 0.7 would break the identity was wrong."}, {"title": "O peso do grupo é a alavanca — e ela funciona", "title_en": "The group weight is the lever — and it works", "body": "Trocar o peso grupo→global de proporcional para <b>igual entre grupos<\/b> faz o <code>N_g<\/code> parar de cancelar, e o agrupamento passa a mudar o modelo. Medido nas 16 runs semeadas: até <b>−3,27 p.p.<\/b> na CNN do zero em participação parcial e <b>−2,18 p.p.<\/b> na LSTM. Como tudo é semeado, cada ponto dessa diferença é do peso, sem ruído a descontar.", "body_en": "Switching the group→global weight from proportional to <b>equal across groups<\/b> stops the <code>N_g<\/code> from cancelling, and grouping starts changing the model. Measured across the 16 seeded runs: up to <b>−3.27 pp<\/b> on the from-scratch CNN under partial participation and <b>−2.18 pp<\/b> on the LSTM. Since everything is seeded, every point of that difference comes from the weight, with no noise to discount."}, {"title": "Sem semente, o ruído engolia o efeito", "title_en": "Without a seed, noise swamped the effect", "body": "Antes de 08/09/2026 o projeto não tinha <code>manual_seed<\/code> nenhum. Duas execuções do <i>mesmo algoritmo<\/i> — FedAvg puro e agrupado, que provamos idênticos — terminaram <b>3,26 p.p.<\/b> apart no CIFAR-10. Era quase o tamanho dos 3,76 p.p. que eu havia atribuído à participação parcial, e numa segunda amostra o sinal chegou a inverter. Depois de semear, duas execuções da mesma configuração batem em todas as casas, inclusive na loss. As simulações marcadas <i>SEM semente<\/i> continuam no painel porque são a régua de ruído, não para atribuir efeito.", "body_en": "Before 2026-09-08 the project had no <code>manual_seed<\/code> anywhere. Two runs of the <i>same algorithm<\/i> — plain and grouped FedAvg, which we proved identical — finished <b>3.26 pp<\/b> apart on CIFAR-10. That was nearly the size of the 3.76 pp I had attributed to partial participation, and on a second sample the sign even flipped. After seeding, two runs of the same configuration match to every digit, loss included. The simulations tagged <i>NO seed<\/i> stay in the dashboard as the noise ruler, not as evidence of effect."}, {"title": "Grupo vazio: calculado, medido, e só importa sob peso igual", "title_en": "Empty groups: computed, measured, and only relevant under equal weight", "body": "O sorteio de clients ignora os grupos. Com 7 de 10 sorteados e grupos de tamanho 3, 3, 2, 2, algum grupo fica vazio em <b>15,0%<\/b> dos rounds — valor exato pela combinatória, que bateu com os 12 de 80 rounds medidos nos logs. Um grupo de 2 fica vazio oito vezes mais que um de 3. Sob peso por exemplos isso não muda nada (peso zero dos dois lados); sob peso igual, os grupos sobreviventes sobem de <code>1/4<\/code> para <code>1/3<\/code> e a influência oscila round a round. Com fração 0,3 e 4 grupos, <b>100%<\/b> dos rounds têm grupo vazio — três clients não cobrem quatro grupos.", "body_en": "Client sampling ignores the groups. With 7 of 10 sampled and groups of size 3, 3, 2, 2, some group is empty in <b>15.0%<\/b> of rounds — the exact combinatorial value, which matched the 12 of 80 rounds measured in the logs. A group of 2 goes empty eight times more often than one of 3. Under example weighting this changes nothing (zero weight on both sides); under equal weighting the surviving groups rise from <code>1/4<\/code> to <code>1/3<\/code> and influence swings round to round. At fraction 0.3 with 4 groups, <b>100%<\/b> of rounds have an empty group — three clients cannot cover four groups."}, {"title": "Pré-treinados quase não reagem ao peso; do zero reagem muito", "title_en": "Pretrained models barely react to the weight; from-scratch ones react a lot", "body": "LoRA DistilGPT-2 variou <b>−0,01<\/b> e <b>−0,18 p.p.<\/b> entre os dois pesos; o probe da ResNet-18, <b>+0,10<\/b> e <b>−0,70<\/b>. O que se treina neles é minúsculo — 147.456 e 5.130 pesos sobre uma representação já pronta — então mudar a média muda pouco. Na prática isso os torna quase imunes ao desequilíbrio de dados entre clients, o que é um argumento a favor deles em cenário federado real.", "body_en": "LoRA DistilGPT-2 moved <b>−0.01<\/b> and <b>−0.18 pp<\/b> between the two weightings; the ResNet-18 probe, <b>+0.10<\/b> and <b>−0.70<\/b>. What is trained in them is tiny — 147,456 and 5,130 weights on top of a ready-made representation — so changing the mean changes little. In practice that makes them nearly immune to data imbalance across clients, which is an argument in their favour for real federated settings."}, {"title": "Na LSTM, o peso igual custa accuracy — e isso é a métrica, não o método", "title_en": "On the LSTM, equal weighting costs accuracy — and that is the metric, not the method", "body": "A LSTM perde <b>1,58<\/b> e <b>2,18 p.p.<\/b> sob peso igual. É a tarefa em que um único autor detém <b>54%<\/b> dos exemplos. O peso por exemplos deixa esse autor dominar o modelo global — e isso <i>infla<\/i> a accuracy, porque a avaliação centralizada é dominada pelo mesmo perfil de texto. O peso igual tira essa vantagem: o modelo fica mais representativo dos autores pequenos e paga na métrica agregada. A leitura honesta é que a accuracy centralizada premia o desequilíbrio; uma accuracy média <i>por client<\/i> contaria outra história.", "body_en": "The LSTM loses <b>1.58<\/b> and <b>2.18 pp<\/b> under equal weighting. It is the task where a single author holds <b>54%<\/b> of the examples. Example weighting lets that author dominate the global model — and that <i>inflates<\/i> accuracy, because centralized evaluation is dominated by the same text profile. Equal weighting removes the advantage: the model becomes more representative of the small authors and pays for it in the aggregate metric. The honest reading is that centralized accuracy rewards imbalance; a <i>per-client<\/i> mean accuracy would tell a different story."}, {"title": "Os dois painéis de CIFAR-10 não medem no mesmo conjunto", "title_en": "The two CIFAR-10 panels are not measured on the same test set", "body": "A CNN do zero é avaliada nas <b>10.000<\/b> imagens do test split completo; o probe da ResNet-18, em <b>1.000<\/b> (<code>MAX_CENTRALIZED_IMAGES = 1000<\/code>, porque cada imagem tem de atravessar o backbone congelado na CPU). Descobri pelo denominador implícito: <code>0,840000<\/code> só sai de 1.000 exemplos. Consequência: erro padrão de <b>≈1,2 p.p.<\/b> no probe contra <b>≈0,5 p.p.<\/b> na CNN. A amostra de 1.000 é aleatória (<code>shuffle(seed=42)<\/code> antes do corte), então é estimativa não-enviesada — só menos precisa.", "body_en": "The from-scratch CNN is evaluated on the full <b>10,000<\/b>-image test split; the ResNet-18 probe on <b>1,000<\/b> (<code>MAX_CENTRALIZED_IMAGES = 1000<\/code>, because every image has to cross the frozen backbone on CPU). I found this from the implied denominator: <code>0.840000<\/code> can only come from 1,000 examples. Consequence: a standard error of <b>≈1.2 pp<\/b> on the probe against <b>≈0.5 pp<\/b> on the CNN. The 1,000-image sample is random (<code>shuffle(seed=42)<\/code> before the cut), so it is an unbiased estimate — just a less precise one."}, {"title": "Auditoria: as runs são reais e conferem com os logs", "title_en": "Audit: the runs are genuine and match their logs", "body": "Em 07/09/2026 confrontei cada CSV com o log de execução: <b>zero divergências<\/b> nas 21 accuracies e 21 losses de cada run, e cada log nomeia o CSV que escreveu. A coluna <code>num_clients_trained<\/code> lê exatamente 10 ou 7 conforme a fração, e a soma das participações por partição fecha em 200 e 140. As contagens de parâmetros foram medidas instanciando os modelos, não copiadas da documentação: <b>62.006<\/b>, <b>5.130<\/b>, <b>2.320.264<\/b> e <b>147.456<\/b>. Uma run de LoRA sem log preservado foi trocada por uma repetição auditável e equivalente.", "body_en": "On 2026-09-07 I checked every CSV against its execution log: <b>zero divergences<\/b> across the 21 accuracies and 21 losses of each run, and every log names the CSV it wrote. The <code>num_clients_trained<\/code> column reads exactly 10 or 7 per the fraction, and per-partition participation sums to 200 and 140. Parameter counts were measured by instantiating the models, not copied from docs: <b>62,006<\/b>, <b>5,130<\/b>, <b>2,320,264<\/b> and <b>147,456<\/b>. One LoRA run with no preserved log was swapped for an auditable, equivalent repeat."}]}, "titulo_en": "Federated learning", "subtitulo_en": "Simulation dashboard"};
const SNAPSHOT_STAMP_PT = "15/09/2026 às 16:41";
const SNAPSHOT_STAMP_EN = "15 Sep 2026, 16:41";
let LAST = null;
let SIM_ID = null;   // simulação na tela
let REF_ID = null;   // simulação de referência (linha tracejada), ou null
let FILTER = "";

// Vírgula decimal em tudo: a página mistura números vindos da configuração
// (fraction-train 0,7) com números medidos, e alternar separador entre eles
// faz o leitor tropeçar.
// Vírgula decimal em português, ponto em inglês.
const br = s => (LANG === "en" ? s : s.replace(".", ","));
const pct = v => br((v * 100).toFixed(2)) + "%";
const pct1 = v => br((v * 100).toFixed(1)) + "%";
const num = v => br(v.toFixed(4));
const STATUS_PT = { planned: "não rodada", pending: "na fila", running: "rodando",
                 interrupted: "interrompida", done: "concluída" };
const STATUS_EN = { planned: "not run", pending: "queued", running: "running",
                 interrupted: "interrupted", done: "done" };
// Proxy em vez de funcao: o resto do codigo ja escrevia STATUS[run.status],
// e trocar todas as chamadas seria mexer em muito mais lugares do que o ganho.
const STATUS = new Proxy({}, { get: (_, k) =>
  (LANG === "en" ? STATUS_EN : STATUS_PT)[k] });
const SIM_STATUS_PT = { pending: "na fila", running: "rodando", partial: "parcial", done: "pronta" };
const SIM_STATUS_EN = { pending: "queued", running: "running", partial: "partial", done: "done" };
const SIM_STATUS = new Proxy({}, { get: (_, k) =>
  (LANG === "en" ? SIM_STATUS_EN : SIM_STATUS_PT)[k] });
const ORIGIN_PT = { scratch: "do zero", pretrained: "pré-treinado" };
const ORIGIN_EN = { scratch: "from scratch", pretrained: "pretrained" };
const ORIGIN = new Proxy({}, { get: (_, k) =>
  (LANG === "en" ? ORIGIN_EN : ORIGIN_PT)[k] });

const simById = id => LAST.simulacoes.find(s => s.id === id);
const selSim = () => simById(SIM_ID);
const refSim = () => (REF_ID ? simById(REF_ID) : null);
const runIn = (sim, runId) => (sim ? sim.runs.find(r => r.id === runId) : null);
const rounds = sim => (sim && sim.config && sim.config.rounds) || 0;

function fmtDuration(seconds) {
  if (seconds == null) return "—";
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  return m ? m + "min " + String(s).padStart(2, "0") + "s" : s + "s";
}

function eta(run, expected) {
  if (run.status !== "running" || run.rows.length < 2 || run.elapsed == null) return null;
  const done = run.rows[run.rows.length - 1].round;
  if (done < 1) return null;
  return (run.elapsed / done) * (expected - done);
}

/* A linha que distingue duas simulações uma da outra. Vive no item da barra
   lateral, no título e no seletor de referência -- sempre a mesma, para o
   leitor reconhecer a simulação pelo mesmo texto nos três lugares. */
function configLine(sim) {
  const c = sim.config || {};
  const bits = [];
  if (c.clients != null) bits.push(c.clients + " " + t("clients"));
  if (c.rounds != null) bits.push(c.rounds + " " + t("rounds"));
  if (c.groups != null) bits.push(c.groups + " " + t("grupos"));
  return bits.join(" · ");
}

function fracLine(sim) {
  const c = sim.config || {};
  if (c.fraction_train == null) return tr(c, "strategy");
  const f = v => br(Number(v).toFixed(1));
  const part = c.fraction_train >= 1
    ? t("participacaoTotal")
    : t("fracao") + f(c.fraction_train) + " / " + f(c.fraction_evaluate != null ? c.fraction_evaluate : c.fraction_train);
  return c.strategy ? part + " · " + tr(c, "strategy") : part;
}

/* ---------------------------------------------------------------- domínios */
function padded(lo, hi) {
  if (lo === hi) return [lo - 0.01, hi + 0.01];
  const p = (hi - lo) * 0.12;
  return [lo - p, hi + p];
}

/* Uma accuracy nunca é negativa, então o respiro embaixo não pode atravessar o
   zero: a LSTM parte de 0,01% e o padding punha um tique de "-1,7%" no eixo,
   que não quer dizer nada. A loss pode ficar onde o padding a puser. */
function domainFor(key, values) {
  const domain = padded(Math.min.apply(null, values), Math.max.apply(null, values));
  if (key === "accuracy") domain[0] = Math.max(0, domain[0]);
  return domain;
}

/* ------------------------------------------------------------------ gráfico
   Duas séries por painel, sempre com o mesmo significado: a série cheia é a
   simulação selecionada, a tracejada é a de referência. O título do painel
   nomeia a tarefa, então a cor não precisa carregar a identidade dela. */
function chart(primary, reference, key, domain, expected, chance) {
  const W = 560, H = 250, M = { t: 16, r: 62, b: 30, l: 54 };
  const [y0, y1] = domain;
  const span = (y1 - y0) || 1;
  const X = r => M.l + (r / expected) * (W - M.l - M.r);
  const Y = v => H - M.b - ((v - y0) / span) * (H - M.t - M.b);
  const fmt = key === "accuracy" ? pct1 : (v => br(v.toFixed(2)));

  let g = "";
  for (let i = 0; i <= 4; i++) {
    const t = y0 + (span * i) / 4;
    const y = Y(t).toFixed(1);
    g += '<line x1="' + M.l + '" y1="' + y + '" x2="' + (W - M.r) + '" y2="' + y +
         '" stroke="var(--grid)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    g += '<text x="' + (M.l - 8) + '" y="' + y + '" fill="var(--muted)" font-size="10" ' +
         'text-anchor="end" dominant-baseline="middle">' + fmt(t) + '</text>';
  }
  // Um tique a cada 5 rounds funciona para 20; para 100 encheria o eixo.
  const step = expected <= 12 ? 2 : expected <= 30 ? 5 : Math.ceil(expected / 10 / 5) * 5;
  for (let r = 0; r <= expected; r += step) {
    g += '<text x="' + X(r).toFixed(1) + '" y="' + (H - M.b + 15) + '" fill="var(--muted)" ' +
         'font-size="10" text-anchor="middle">' + r + '</text>';
  }
  g += '<text x="' + ((M.l + W - M.r) / 2) + '" y="' + (H - 2) +
       '" fill="var(--muted)" font-size="10" text-anchor="middle">' + t("round") + "</text>";
  g += '<line x1="' + M.l + '" y1="' + (H - M.b) + '" x2="' + (W - M.r) + '" y2="' + (H - M.b) +
       '" stroke="var(--axis)" stroke-width="1" vector-effect="non-scaling-stroke"/>';

  // Linha do acaso: referência recessiva, nunca uma série.
  if (key === "accuracy" && chance != null && chance > y0 && chance < y1) {
    g += '<line x1="' + M.l + '" y1="' + Y(chance).toFixed(1) + '" x2="' + (W - M.r) +
         '" y2="' + Y(chance).toFixed(1) + '" stroke="var(--axis)" stroke-width="1" ' +
         'stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>';
    g += '<text x="' + (W - M.r + 5) + '" y="' + Y(chance).toFixed(1) +
         '" fill="var(--muted)" font-size="9.5" dominant-baseline="middle">' + t("acaso") + "</text>";
  }

  const line = (rows, color, dashed) => {
    if (!rows || !rows.length) return "";
    const d = rows.map((row, i) => (i ? "L" : "M") + X(row.round).toFixed(1) + " " +
              Y(row[key]).toFixed(1)).join(" ");
    return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" ' +
      (dashed ? 'stroke-dasharray="5 4" ' : "") +
      'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  };

  // Referência primeiro, para a série selecionada ficar por cima.
  g += line(reference, "var(--s-ref)", true);
  g += line(primary, "var(--s-sel)", false);

  // Rótulos diretos só nos pontos que importam: o último de cada série.
  const endLabel = (rows, color, anchorShift) => {
    if (!rows || !rows.length) return "";
    const last = rows[rows.length - 1];
    return '<circle cx="' + X(last.round).toFixed(1) + '" cy="' + Y(last[key]).toFixed(1) +
      '" r="4.5" fill="' + color + '" stroke="var(--surface)" stroke-width="2"/>' +
      '<text x="' + Math.min(X(last.round) + 9, W - 4).toFixed(1) + '" y="' +
      (Y(last[key]) + anchorShift).toFixed(1) + '" fill="var(--ink-2)" font-size="11" ' +
      'dominant-baseline="middle">' + fmt(last[key]) + '</text>';
  };
  // Se as duas pontas caem quase no mesmo lugar, separa os rótulos.
  let shiftRef = 0;
  if (primary && primary.length && reference && reference.length) {
    const a = Y(primary[primary.length - 1][key]);
    const b = Y(reference[reference.length - 1][key]);
    if (Math.abs(a - b) < 13) shiftRef = b < a ? -8 : 8;
  }
  g += endLabel(reference, "var(--s-ref)", shiftRef);
  g += endLabel(primary, "var(--s-sel)", 0);

  g += '<g class="cross" opacity="0"><line y1="' + M.t + '" y2="' + (H - M.b) +
       '" stroke="var(--axis)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
       '<circle r="4.5" fill="var(--s-sel)" stroke="var(--surface)" stroke-width="2"/></g>';
  g += '<rect class="hit" x="' + M.l + '" y="' + M.t + '" width="' + (W - M.l - M.r) +
       '" height="' + (H - M.t - M.b) + '" fill="transparent"/>';

  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>';
  return { svg, W, H, M, X, Y, expected };
}

function attachHover(box, primary, reference, key, geo, refLabel) {
  const svg = box.querySelector("svg");
  const tip = box.querySelector(".tip");
  const cross = svg.querySelector(".cross");
  const hit = svg.querySelector(".hit");
  if (!primary || !primary.length) return;

  hit.addEventListener("mousemove", e => {
    const rect = svg.getBoundingClientRect();
    const vx = ((e.clientX - rect.left) / rect.width) * geo.W;
    const target = ((vx - geo.M.l) / (geo.W - geo.M.l - geo.M.r)) * geo.expected;
    let d = primary[0];
    for (const row of primary) {
      if (Math.abs(row.round - target) < Math.abs(d.round - target)) d = row;
    }
    const ref = reference ? reference.find(row => row.round === d.round) : null;
    const px = geo.X(d.round), py = geo.Y(d[key]);
    cross.setAttribute("opacity", "1");
    const line = cross.querySelector("line");
    line.setAttribute("x1", px); line.setAttribute("x2", px);
    const dot = cross.querySelector("circle");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py);
    tip.innerHTML = "<b>" + t("round").replace(/^./, m => m.toUpperCase()) + " " + d.round + "</b><br>" +
      "<span class='k'>accuracy</span> " + pct(d.accuracy) +
      "<br><span class='k'>loss</span> " + num(d.loss) +
      "<br><span class='k'>" + t("clientsTreinados") + "</span> " +
      (d.clients == null ? t("modeloInicial") : d.clients) +
      (ref ? "<br><span class='k'>" + refLabel + "</span> " + pct(ref.accuracy) : "");
    tip.style.opacity = "1";
    const left = (px / geo.W) * rect.width;
    tip.style.left = Math.min(Math.max(left + 14, 4), rect.width - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max((py / geo.H) * rect.height - 12, 2) + "px";
  });
  hit.addEventListener("mouseleave", () => {
    cross.setAttribute("opacity", "0");
    tip.style.opacity = "0";
  });
}

/* ======================================================== barra lateral */
function matchesFilter(sim) {
  if (!FILTER) return true;
  const haystack = [
    sim.label, sim.id, configLine(sim), fracLine(sim), sim.summary || "",
    ...sim.runs.map(r => r.label),
  ].join(" ").toLowerCase();
  return FILTER.split(/\s+/).every(term => haystack.includes(term));
}

function simButton(sim) {
  const active = sim.id === SIM_ID;
  const button = document.createElement("button");
  button.className = "sim";
  button.type = "button";
  button.setAttribute("aria-current", String(active));
  button.title = tr(sim, "label") + " — " + configLine(sim);
  const done = sim.counts.done, total = sim.runs.length;
  const stateClass = sim.state === "done" ? "done" : sim.state === "running" ? "running" : "";
  const stateText = sim.state === "running"
    ? sim.counts.running + " rodando"
    : SIM_STATUS[sim.state] + (sim.state === "done" ? "" : " " + done + "/" + total);
  button.innerHTML =
    '<span class="stop"><span class="sname"></span>' +
    '<span class="sstate ' + stateClass + '"></span></span>' +
    '<span class="scfg"></span><span class="sfrac"></span>';
  button.querySelector(".sname").textContent = tr(sim, "label");
  button.querySelector(".sstate").textContent = stateText;
  button.querySelector(".scfg").textContent = configLine(sim);
  button.querySelector(".sfrac").textContent = fracLine(sim);
  button.onclick = () => selectSim(sim.id);
  return button;
}

function runList(sim) {
  const list = document.createElement("ul");
  list.className = "runs";
  sim.runs.forEach(run => {
    const item = document.createElement("li");
    const link = document.createElement("button");
    link.type = "button";
    link.title = tr(run, "label") + " — " + STATUS[run.status];
    link.innerHTML = '<span class="dot ' + run.status + '"></span>' +
      '<span class="rlabel"></span><span class="rorigin"></span>';
    link.querySelector(".rlabel").textContent = tr(run, "label");
    link.querySelector(".rorigin").textContent = ORIGIN[run.origin] || "";
    link.onclick = () => {
      const target = document.getElementById("acc-" + run.id);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    };
    item.appendChild(link);
    list.appendChild(item);
  });
  return list;
}

function renderNav() {
  const box = document.getElementById("sim-nav");
  box.innerHTML = "";

  const visible = LAST.simulacoes.filter(matchesFilter);
  document.getElementById("sim-count").textContent =
    visible.length === LAST.simulacoes.length
      ? String(LAST.simulacoes.length)
      : visible.length + "/" + LAST.simulacoes.length;

  if (!visible.length) {
    box.innerHTML = '<p class="side-empty">' + t("semFiltro") + "</p>";
  } else {
    // As seções vêm do manifesto e mantêm a ordem declarada lá; uma simulação
    // sem grupo, ou com grupo desconhecido, cai numa seção final em vez de
    // sumir da barra.
    const declared = (LAST.grupos || []).map(g => ({ ...g }));
    const known = new Set(declared.map(g => g.id));
    const buckets = declared.map(g => ({ g, sims: visible.filter(s => s.grupo === g.id) }));
    const loose = visible.filter(s => !known.has(s.grupo));
    if (loose.length) buckets.push({ g: { id: "_", label: t("outras") }, sims: loose });

    const named = buckets.filter(b => b.sims.length).length > 1;
    buckets.forEach(bucket => {
      if (!bucket.sims.length) return;
      const section = document.createElement("div");
      section.className = "simgroup";
      if (named) {
        const title = document.createElement("div");
        title.className = "gname";
        title.textContent = tr(bucket.g, "label") || bucket.g.label;
        section.appendChild(title);
      }
      bucket.sims.forEach(sim => {
        section.appendChild(simButton(sim));
        if (sim.id === SIM_ID) section.appendChild(runList(sim));
      });
      box.appendChild(section);
    });
  }

}

/* ========================================================= planejamento
   O estado dos checks vive no localStorage do navegador, com o `feito` do
   manifesto como valor de partida. Assim marcar um item é imediato e não
   depende de escrever no disco (o sincronizador reescreve o manifesto a cada
   5s e sobrescreveria), e ao mesmo tempo um item genuinamente concluído pode
   ser gravado de vez no manifesto, valendo para qualquer navegador. */
const PLANO_CHAVE = "fl-plano-feitos";

function planoLidos() {
  try {
    return JSON.parse(localStorage.getItem(PLANO_CHAVE) || "{}");
  } catch (erro) {
    return {};   // navegação privada, site data bloqueado: cai no manifesto
  }
}

function planoGravar(estado) {
  try {
    localStorage.setItem(PLANO_CHAVE, JSON.stringify(estado));
  } catch (erro) {
    /* sem persistência neste navegador; a marcação vale só para esta sessão */
  }
}

function planoFeito(item, estado) {
  return item.label in estado ? estado[item.label] : !!item.feito;
}

/* ===================================================== panorama e achados
   As duas secoes falam do projeto inteiro, nao da simulacao na tela. O
   panorama e a unica visao em que todas as simulacoes aparecem juntas: o resto
   da pagina compara no maximo duas por vez. */
function renderPanorama() {
  const tarefas = [];
  LAST.simulacoes.forEach(s => s.runs.forEach(r => {
    if (!tarefas.includes(r.id)) tarefas.push(r.id);
  }));
  const rotulo = id => {
    for (const s of LAST.simulacoes) {
      const r = s.runs.find(x => x.id === id);
      if (r) return tr(r, "label");
    }
    return id;
  };

  document.getElementById("panorama-nota").textContent = t("panoramaNota");
  const head = '<thead><tr><th>' + t("simulacao") + "</th>" +
    tarefas.map(id => "<th>" + rotulo(id) + "</th>").join("") + "</tr></thead>";

  const body = LAST.simulacoes.map(s => {
    const atual = s.id === SIM_ID;
    const celulas = tarefas.map(id => {
      const run = s.runs.find(r => r.id === id);
      if (!run || run.final == null) return '<td class="empty">—</td>';
      // Uma run interrompida tem numero, mas nao no round 20: marcar evita que
      // ela seja lida como resultado final de uma run completa.
      const parcial = run.status !== "done";
      return "<td" + (parcial ? ' class="empty"' : "") + ">" + pct(run.final) +
        (parcial ? " <span class='badge'>r" + run.last_round + "</span>" : "") + "</td>";
    }).join("");
    return "<tr" + (atual ? ' style="font-weight:600"' : "") + "><td>" +
      tr(s, "label") + " <span class='badge'>" + configLine(s) + "</span></td>" +
      celulas + "</tr>";
  }).join("");

  document.getElementById("panorama").innerHTML = head + "<tbody>" + body + "</tbody>";
}

function renderAchados() {
  const bloco = LAST.achados || {};
  const itens = bloco.itens || [];
  document.getElementById("achados-section").classList.toggle("hidden", !itens.length);
  document.getElementById("achados").innerHTML =
    (tr(bloco, "intro") ? '<p class="note" style="margin:0 0 6px">' + tr(bloco, "intro") + "</p>" : "") +
    itens.map(item => "<h4>" + tr(item, "title") + "</h4><p>" + tr(item, "body") + "</p>").join("");
}

function renderPlano() {
  const itens = LAST.planejadas || [];
  const plano = LAST.planejamento || {};
  const estado = planoLidos();
  const feitos = itens.filter(item => planoFeito(item, estado)).length;

  document.getElementById("plan-count").textContent = feitos + "/" + itens.length;
  document.getElementById("plan-resumo").textContent =
    feitos === itens.length && itens.length
      ? t("todosConcluidos")
      : feitos + " " + t("de") + " " + itens.length + " " + t("concluidos");

  document.getElementById("plan-intro").innerHTML =
    (tr(plano, "intro") ? "<p>" + tr(plano, "intro") + "</p>" : "") +
    ((LANG === "en" && plano.avisos_en) || plano.avisos || [])
      .map(aviso => '<p class="plan-aviso">' + aviso + "</p>").join("");

  const lista = document.getElementById("plan-lista");
  lista.innerHTML = "";
  itens.forEach((item, indice) => {
    const marcado = planoFeito(item, estado);
    const li = document.createElement("li");
    li.className = "plan-item" + (marcado ? " feito" : "");

    const id = "plan-check-" + indice;
    li.innerHTML =
      '<input type="checkbox" id="' + id + '"' + (marcado ? " checked" : "") + '>' +
      '<div class="plan-corpo">' +
        '<label for="' + id + '" class="plan-titulo">' + tr(item, "label") + '</label>' +
        (item.eixo ? '<span class="plan-eixo">' + tr(item, "eixo") + "</span>" : "") +
        '<p class="plan-detalhe">' + tr(item, "detail") + "</p>" +
      "</div>";

    li.querySelector("input").onchange = evento => {
      const atual = planoLidos();
      atual[item.label] = evento.target.checked;
      planoGravar(atual);
      renderPlano();
    };
    lista.appendChild(li);
  });

  document.getElementById("plan-nota").textContent = t("planNota");
}

/* Separa a ficha técnica em "vale para todas as tarefas" e "muda entre elas".
   Repetir "1 época local" em quatro cartões não informa nada — o que informa é
   que a LoRA usa AdamW enquanto as outras três usam SGD. Então o comum sobe
   para o cabeçalho e só o divergente fica no cartão. Com uma tarefa só, tudo
   vira cabeçalho, que é a leitura certa nesse caso. */
function repartirHyper(sim) {
  const comRuns = sim.runs.filter(r => Object.keys(fichaDe(r)).length);
  if (!comRuns.length) return { comum: [], excecoes: new Map() };
  const chaves = [];
  comRuns.forEach(r => Object.keys(fichaDe(r)).forEach(k => {
    if (!chaves.includes(k)) chaves.push(k);
  }));

  const comum = [];
  // Por chave, quais runs fogem do valor padrão. Uma chave ausente daqui não
  // tem padrão, e aparece inteira nos cartões.
  const excecoes = new Map();

  chaves.forEach(chave => {
    const contagem = new Map();
    comRuns.forEach(r => {
      const v = fichaDe(r)[chave];
      if (v !== undefined) contagem.set(v, (contagem.get(v) || 0) + 1);
    });
    let dominante = null, maior = 0;
    contagem.forEach((n, v) => { if (n > maior) { maior = n; dominante = v; } });

    // Só vira padrão se valer para MAIS DA METADE das tarefas. Com 2 de 4 não
    // há padrão -- haveria duas leituras igualmente válidas de qual é a regra
    // e qual é a exceção, e escolher uma seria arbitrário.
    if (dominante === null || maior * 2 <= comRuns.length) return;

    const fogem = comRuns.filter(r => fichaDe(r)[chave] !== dominante);
    comum.push([chave, dominante, fogem.map(r => [tr(r, "label"), fichaDe(r)[chave]])]);
    excecoes.set(chave, new Set(fogem.map(r => r.id)));
  });

  return { comum, excecoes };
}

/* Uma chave aparece no cartão quando não tem padrão (não está em `excecoes`)
   ou quando esta tarefa é justamente a exceção. */
// A ficha da run no idioma corrente: `hyper` em pt, `hyper_en` em ingles.
function fichaDe(run) {
  return (LANG === "en" && run.hyper_en) || run.hyper || {};
}

function hyperDoCartao(run, excecoes) {
  if (!Object.keys(fichaDe(run)).length) return [];
  return Object.entries(fichaDe(run)).filter(([chave]) => {
    const fogem = excecoes.get(chave);
    return !fogem || fogem.has(run.id);
  });
}

/* ============================================================== faixa */
function renderBanner() {
  const sim = selSim();
  const c = sim.config || {};
  const chips = [];
  const pushChip = (label, value) =>
    chips.push('<span class="chip">' + label + ' <b>' + value + "</b></span>");

  if (c.clients != null) pushChip(t("clients"), c.clients);
  if (c.rounds != null) pushChip(t("rounds"), c.rounds);
  if (c.groups != null) pushChip(t("grupos"), c.groups);
  if (c.fraction_train != null) pushChip("fraction-train", br(Number(c.fraction_train).toFixed(1)));
  if (c.fraction_evaluate != null) pushChip("fraction-evaluate", br(Number(c.fraction_evaluate).toFixed(1)));
  if (c.seed != null) pushChip("seed", c.seed);
  // Tudo que não cabe nos campos fixos entra aqui, sem o painel precisar
  // conhecer o nome do parâmetro: cada simulação declara o que a distingue.
  (c.extra || []).forEach(item => pushChip(tr(item, "k"), tr(item, "v")));

  const partial = c.fraction_train != null && c.fraction_train < 1;
  const sampled = (c.clients != null && c.fraction_train != null)
    ? Math.round(c.fraction_train * c.clients) : null;
  const headline = sampled == null
    ? tr(sim, "label")
    : partial
      ? sampled + " " + t("de") + " " + c.clients + " " + t("treinamPorRound")
      : t("todosOs") + " " + c.clients + " " + t("treinamPorRound");

  // A ficha comum às tarefas vem logo abaixo do resumo, em pares nome/valor:
  // é a configuração que vale para a simulação inteira, e não precisa ser
  // repetida em cada cartão.
  const { comum } = repartirHyper(sim);
  const ficha = comum.length
    ? '<dl class="ficha">' + comum.map(([chave, valor, fogem]) =>
        "<dt>" + chave + "</dt><dd>" + valor +
        (fogem.length
          ? '<span class="excecao">exceto ' + fogem.map(
              ([nome, v]) => nome + ": " + v).join(" · ") + "</span>"
          : "") + "</dd>").join("") + "</dl>"
    : "";

  document.getElementById("banner").innerHTML =
    '<div class="btag">' + (tr(c, "strategy") || t("simulacao")) + '</div>' +
    '<div class="btitle">' + headline + '</div>' +
    '<p class="bsum">' + tr(sim, "summary") + '</p>' +
    (sim.notice ? '<p class="bnotice">' + sim.notice + '</p>' : "") +
    '<div class="chips">' + chips.join("") + '</div>' +
    ficha;

  document.getElementById("page-title").textContent =
    tr(sim, "label") + " — " + configLine(sim);
  document.title = "FL — " + tr(sim, "label") + " (" + configLine(sim) + ")";
}

/* ============================================================== cards */
function renderCards() {
  const box = document.getElementById("cards");
  const sim = selSim();
  const expected = rounds(sim);
  const { excecoes } = repartirHyper(sim);
  box.innerHTML = "";
  sim.runs.forEach(run => {
    const done = run.last_round == null ? 0 : run.last_round;
    const frac = expected ? done / expected : 0;
    const remaining = eta(run, expected);

    let hero = '<div class="hero"><small>' +
      (run.status === "planned" ? t("naoRodadaAqui") : t("aguardando")) + '</small></div>';
    if (run.rows.length) {
      const delta = run.baseline == null ? null : run.final - run.baseline;
      hero = '<div class="hero">' + pct(run.final) + ' <small>accuracy</small></div>' +
        (delta == null ? "" :
          '<div class="delta" style="color:' + (delta > 0 ? "var(--good)" : "var(--ink-2)") + '">' +
          (delta > 0 ? "+" : "") + br((delta * 100).toFixed(2)) + " " + t("vsRound0") + "</div>") +
        '<div class="delta" style="color:var(--muted)">' + t("pico") + " " + pct(run.best.accuracy) +
        " " + t("noRound") + " " + run.best.round + " · loss " + num(run.final_loss) + '</div>';
    }

    const right = run.status === "running" && remaining != null
      ? "≈ " + fmtDuration(remaining) + " " + t("restantes")
      : run.status === "done" ? fmtDuration(run.elapsed) + " " + t("noTotal")
      : run.status === "interrupted" ? "parou no round " + done + " de " + expected : "";

    // Só o que distingue esta tarefa das outras da simulação. O que é igual
    // nas quatro já está no cabeçalho.
    const proprios = hyperDoCartao(run, excecoes);
    const ficha = proprios.length
      ? '<dl class="ficha compacta">' + proprios.map(([k, v]) =>
          "<dt>" + k + "</dt><dd>" + v + "</dd>").join("") + "</dl>"
      : "";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<h3>' + tr(run, "label") + '</h3>' +
      '<p class="meta"><span class="badge">' + (ORIGIN[run.origin] || "") + '</span> ' +
        '<span class="pill ' + run.status + '">' + STATUS[run.status] + '</span></p>' +
      hero + ficha +
      '<div class="bar"><i style="width:' + (Math.min(frac, 1) * 100).toFixed(1) + '%"></i></div>' +
      '<div class="barlab"><span>' + t("round") + " " + done + " / " + expected + '</span><span>' +
        right + '</span></div>';
    box.appendChild(card);
  });
}

/* =========================================================== gráficos */
function renderCharts(containerId, key) {
  const box = document.getElementById(containerId);
  const sim = selSim();
  const ref = refSim();
  const expected = rounds(sim);
  const refLabel = ref ? tr(ref, "label").toLowerCase() : t("referencia");

  let common = null;
  if (SCALE_MODE === "common") {
    const all = sim.runs.flatMap(r => r.rows.map(d => d[key])).filter(v => v != null);
    if (all.length) common = domainFor(key, all);
  }

  box.innerHTML = "";
  sim.runs.forEach(run => {
    const reference = runIn(ref, run.id);
    // A referência pode ter rodado mais rounds que a simulação na tela; o eixo
    // é o desta, então o excedente é cortado em vez de sair do gráfico.
    const refRows = reference ? reference.rows.filter(d => d.round <= expected) : [];
    const card = document.createElement("div");
    card.className = "card";
    card.id = (key === "accuracy" ? "acc-" : "loss-") + run.id;

    // O conjunto de avaliação fica no subtítulo do painel de accuracy porque é
    // ele que decide a resolução do número: 84,00% medido em 1.000 imagens não
    // é o mesmo tipo de medida que 33,53% medido em 10.000.
    const title = '<h3>' + tr(run, "label") + '<span class="badge" style="margin-left:auto">' +
      (ORIGIN[run.origin] || "") + '</span></h3>' +
      '<p class="meta">' + (key === "accuracy" ? tr(run, "metric") : t("lossCentralizada")) +
      (key === "accuracy" && tr(run, "eval_set") ? t("medidaEm") + tr(run, "eval_set") : "") + '</p>';

    if (!run.rows.length) {
      card.innerHTML = title + '<div class="empty-panel">' +
        (run.status === "planned" ? t("tarefaNaoRodada") : t("aguardandoInicio")) + '</div>';
      box.appendChild(card);
      return;
    }

    const values = run.rows.map(d => d[key]).concat(refRows.map(d => d[key]));
    const domain = common || domainFor(key, values);
    const geo = chart(run.rows, refRows, key, domain, expected, run.chance);
    card.innerHTML = title + '<div class="chartbox">' + geo.svg + '<div class="tip"></div></div>';
    box.appendChild(card);
    attachHover(card.querySelector(".chartbox"), run.rows, refRows, key, geo, refLabel);
  });
}

/* ======================================================== comparações */
function renderVersus() {
  const sim = selSim();
  const ref = refSim();
  const section = document.getElementById("versus-section");
  // Sem referência escolhida a tabela teria uma coluna vazia e uma diferença
  // que não existe, então a seção inteira sai.
  section.classList.toggle("hidden", !ref);
  if (!ref) return;

  document.getElementById("versus-title").textContent =
    tr(sim, "label") + " " + t("contra") + " " + tr(ref, "label");
  const sameConfig = configLine(sim) === configLine(ref);
  document.getElementById("versus-note").textContent = sameConfig
    ? t("mesmaConfig")
    : t("configDiferente") + " (" + configLine(sim) + " " + t("contra") + " " +
      configLine(ref) + ")" + t("aDiferencaMistura");

  const head = '<thead><tr><th>' + t("tarefa") + "</th><th>" + tr(sim, "label") +
    "</th><th>" + tr(ref, "label") + "</th><th>" + t("diferenca") + "</th>" +
    "<th>" + t("picoSel") + "</th><th>" + t("picoRef") + "</th></tr></thead>";

  const body = sim.runs.map(run => {
    const reference = runIn(ref, run.id);
    const a = run.final, b = reference ? reference.final : null;
    const diff = (a == null || b == null) ? null : a - b;
    const cell = v => v == null ? '<td class="empty">—</td>' : "<td>" + pct(v) + "</td>";
    const diffCell = diff == null ? '<td class="empty">—</td>'
      : '<td class="' + (diff >= 0 ? "up" : "down") + '">' +
        (diff > 0 ? "+" : "") + br((diff * 100).toFixed(2)) + " p.p.</td>";
    const peak = r => (r && r.best) ? "<td>" + pct(r.best.accuracy) + " (r" + r.best.round + ")</td>"
      : '<td class="empty">—</td>';
    return "<tr><td>" + tr(run, "label") + " <span class='badge'>" + (ORIGIN[run.origin] || "") + "</span></td>" +
      cell(a) + cell(b) + diffCell + peak(run) + peak(reference) + "</tr>";
  }).join("");

  document.getElementById("versus").innerHTML = head + "<tbody>" + body + "</tbody>";
}

function renderSummary() {
  const runs = selSim().runs;
  const L = t("linhasDetalhe");
  const spec = [
    [L[0], r => r.status === "running" ? t("statusRodando") + " " + (r.last_round || 0) + ")"
      : r.status === "interrupted"
        ? t("statusInterrompida") + " " + (r.last_round || 0) + " " + t("de") + " " + rounds(selSim()) +
          (r.interrupted_note ? " — " + r.interrupted_note : "")
        : STATUS[r.status]],
    [L[1], r => r.csv || "—"],
    [L[2], r => tr(r, "eval_set") || "—"],
    [L[3], r => r.baseline == null ? "—" : pct(r.baseline)],
    [L[4], r => r.best ? pct(r.best.accuracy) + " (" + t("round") + " " + r.best.round + ")" : "—"],
    [L[5], r => r.final == null ? "—" : pct(r.final)],
    [L[6], r => (r.baseline == null || r.final == null) ? "—" :
      (r.final - r.baseline > 0 ? "+" : "") + br(((r.final - r.baseline) * 100).toFixed(2)) + " " + t("pp")],
    [L[7], r => r.final_loss == null ? "—" : num(r.final_loss)],
    [L[8], r => r.client_counts && r.client_counts.length
      ? r.client_counts.join(" / ") : "—"],
    [L[9], r => fmtDuration(r.elapsed)],
  ];
  // A tabela é o único lugar onde a ficha técnica das tarefas aparece lado a
  // lado na mesma linha, então aqui vale repetir mesmo o que é comum: é o que
  // permite conferir que só uma coisa mudou.
  // A ficha tem chaves proprias em cada idioma, entao a lista de linhas sai
  // do dicionario do idioma corrente.
  const chavesHyper = [];
  runs.forEach(r => Object.keys(fichaDe(r)).forEach(k => {
    if (!chavesHyper.includes(k)) chavesHyper.push(k);
  }));
  const completo = spec.concat(
    chavesHyper.map(chave => [chave, r => fichaDe(r)[chave] || "—"])
  );

  const head = '<thead><tr><th></th>' + runs.map(r => "<th>" + tr(r, "label") + "</th>").join("") + "</tr></thead>";
  const body = completo.map(entry =>
    "<tr><td>" + entry[0] + "</td>" + runs.map(r => "<td>" + entry[1](r) + "</td>").join("") +
    "</tr>").join("");
  document.getElementById("summary").innerHTML = head + "<tbody>" + body + "</tbody>";
}

function renderTable() {
  const sim = selSim();
  const runs = sim.runs;
  const expected = rounds(sim);
  const bestRound = runs.map(r => (r.best ? r.best.round : null));
  const head = '<thead><tr class="group"><th></th>' +
    runs.map(r => '<th colspan="3">' + tr(r, "label") + '</th>').join("") +
    '</tr><tr><th>' + t("round").replace(/^./, m => m.toUpperCase()) + '</th>' +
    runs.map(() => "<th>accuracy</th><th>loss</th><th>" + t("clients") + "</th>").join("") + '</tr></thead>';

  let body = "";
  for (let r = 0; r <= expected; r++) {
    const cells = runs.map((run, i) => {
      const row = run.rows.find(d => d.round === r);
      if (!row) return '<td class="empty">—</td><td class="empty">—</td><td class="empty">—</td>';
      const cls = bestRound[i] === r ? ' class="best"' : "";
      return "<td" + cls + ">" + pct(row.accuracy) + "</td><td>" + num(row.loss) + "</td>" +
        "<td>" + (row.clients == null ? "—" : row.clients) + "</td>";
    }).join("");
    body += '<tr' + (r === 0 ? ' class="r0"' : "") + '><td>' +
      (r === 0 ? "0 · " + t("inicial") : r) + "</td>" + cells + "</tr>";
  }
  document.getElementById("table").innerHTML = head + "<tbody>" + body + "</tbody>";
}

/* ================================================================ estado */
function writeHash() {
  const parts = ["sim=" + encodeURIComponent(SIM_ID)];
  if (REF_ID) parts.push("ref=" + encodeURIComponent(REF_ID));
  if (LANG !== "pt") parts.push("lang=" + LANG);
  // replaceState em vez de location.hash: trocar de simulação não é navegação,
  // e encher o histórico faria o "voltar" do navegador ficar inútil.
  //
  // No HTML congelado a página é aberta por file://, e aí o Chrome recusa
  // replaceState (origem "null"). Sem o try o erro subiria até o catch do
  // tick(), que anunciaria falha de render numa página que renderizou bem.
  // Perder o link com a simulação no endereço é aceitável; perder a página não.
  try {
    history.replaceState(null, "", "#" + parts.join("&"));
  } catch (error) {
    /* endereço sem estado; a barra lateral continua sendo a navegação */
  }
}

function readHash() {
  const raw = location.hash.replace(/^#/, "");
  const out = {};
  raw.split("&").forEach(pair => {
    const [k, v] = pair.split("=");
    if (k) out[k] = decodeURIComponent(v || "");
  });
  return out;
}

function selectSim(id) {
  if (id === SIM_ID) return;
  SIM_ID = id;
  const sim = selSim();
  // A referência sugerida no manifesto vale como ponto de partida; se a
  // simulação nova não sugere nenhuma, a comparação sai em vez de apontar para
  // uma simulação que nada tem a ver.
  REF_ID = sim.compare_to && simById(sim.compare_to) ? sim.compare_to : null;
  writeHash();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================ diagramas
   Duas coisas que a prosa faz o leitor montar de cabeça: por onde os pesos
   passam -- e em qual dos dois hops o experimento mexe -- e quanto de cada
   modelo realmente viaja pela rede a cada round. Os dois desenhos existem
   para tornar isso apontável.

   Os números vêm de hiperparametros.py, que por sua vez saiu da leitura do
   código; duplicá-los aqui é o preço de o painel ser um HTML sem build. */

const GRUPOS_CLIENTS = [[2, 3, 7], [5, 6, 8], [4, 9], [0, 1]];

const MODELOS = {
  "cifar10": {
    nome: "CNN do quickstart Flower",
    base: 0, treinavel: 62006,
    nota: "treinada do zero — não há parte congelada, o modelo inteiro viaja",
  },
  "cifar10-pretrained": {
    nome: "ResNet-18 congelada + head linear",
    base: 11176512, treinavel: 5130,
    nota: "backbone em eval, sem a cabeça ImageNet; só o nn.Linear(512, 10) treina",
  },
  "stackexchange": {
    nome: "LSTM in-house",
    base: 0, treinavel: 2320264,
    nota: "treinada do zero — não há parte congelada, o modelo inteiro viaja",
  },
  "stackexchange-pretrained": {
    nome: "DistilGPT-2 congelado + adapters LoRA",
    base: 81912576, treinavel: 147456,
    nota: "LoRA rank 8, α 16, em attn.c_attn (12 tensores), com B zerado no início",
  },
};

const milhar = n => n.toLocaleString("pt-BR");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

function pesoDoGrupo(sim) {
  const achado = ((sim.config || {}).extra || []).find(e => e.k === "peso grupo→global");
  return achado ? achado.v : null;
}

/* ---------------------------------------------- caixa-preta de agregação */
function diagramaAgregacao(sim) {
  const c = sim.config || {};
  const agrupado = c.groups != null;
  const igual = pesoDoGrupo(sim) === "igual";
  const frac = c.fraction_train;
  const parcial = frac != null && frac < 1;
  const sorteados = (c.clients != null && frac != null)
    ? Math.round(frac * c.clients) : c.clients;

  // Os clients são desenhados na ordem dos grupos, para os agrupamentos
  // ficarem contíguos: um grupo que aparece espalhado não se lê como grupo.
  const R = 15, DX = 48, GAP = 30;
  let x = 40;
  const clientes = [], grupos = [];
  GRUPOS_CLIENTS.forEach((ids, gi) => {
    const inicio = x;
    ids.forEach(id => { clientes.push({ id: id, cx: x }); x += DX; });
    grupos.push({ nome: "ABCD"[gi], cx: (inicio + x - DX) / 2, n: ids.length });
    x += GAP;
  });
  const centro = (clientes[0].cx + clientes[clientes.length - 1].cx) / 2;
  const ANOT = 660, W = 900, H = agrupado ? 300 : 232;

  const yCli = 46, yGrp = 116, hGrp = 40, yGlb = agrupado ? 232 : 164, hGlb = 46;
  const ACC = "var(--s-sel)";

  let s = "";
  s += '<defs><marker id="dseta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"'
     + ' markerHeight="6" orient="auto-start-reverse">'
     + '<path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>'
     + '<marker id="dsetaA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"'
     + ' markerHeight="6" orient="auto-start-reverse">'
     + '<path d="M0,0 L10,5 L0,10 z" fill="' + ACC + '"/></marker></defs>';

  // nível 1 -- os clients
  clientes.forEach(cl => {
    s += '<circle cx="' + cl.cx + '" cy="' + yCli + '" r="' + R + '" fill="var(--surface-2)"'
       + ' stroke="currentColor" stroke-width="1.2"/>'
       + '<text x="' + cl.cx + '" y="' + (yCli + 4) + '" text-anchor="middle" font-size="12"'
       + ' fill="currentColor">' + cl.id + "</text>";
  });
  s += '<text x="40" y="' + (yCli - 26) + '" font-size="12" fill="currentColor">'
     + (c.clients || 10) + " clients (uma partição de dados cada)</text>";

  if (agrupado) {
    // nível 2 -- um modelo por grupo
    grupos.forEach((g, gi) => {
      const bx = g.cx - 50;
      s += '<rect x="' + bx + '" y="' + yGrp + '" width="100" height="' + hGrp + '" rx="7"'
         + ' fill="var(--surface-2)" stroke="currentColor" stroke-width="1.2"/>'
         + '<text x="' + g.cx + '" y="' + (yGrp + 17) + '" text-anchor="middle" font-size="11.5"'
         + ' fill="currentColor">modelo do</text>'
         + '<text x="' + g.cx + '" y="' + (yGrp + 31) + '" text-anchor="middle" font-size="11.5"'
         + ' font-weight="600" fill="currentColor">grupo ' + g.nome + "</text>";
      // clients -> grupo
      GRUPOS_CLIENTS[gi].forEach(id => {
        const cl = clientes.find(k => k.id === id);
        s += '<line x1="' + cl.cx + '" y1="' + (yCli + R) + '" x2="' + g.cx + '" y2="' + yGrp
           + '" stroke="currentColor" stroke-width="1" opacity="0.55" marker-end="url(#dseta)"/>';
      });
      // grupo -> global : o hop que o experimento muda
      s += '<line x1="' + g.cx + '" y1="' + (yGrp + hGrp) + '" x2="' + centro + '" y2="' + yGlb
         + '" stroke="' + (igual ? ACC : "currentColor") + '" stroke-width="'
         + (igual ? 2 : 1.2) + '" opacity="' + (igual ? 1 : 0.7)
         + '" marker-end="url(#' + (igual ? "dsetaA" : "dseta") + ')"/>';
      // o peso, escrito em cima da seta
      const mx = (g.cx + centro) / 2, my = (yGrp + hGrp + yGlb) / 2;
      s += '<rect x="' + (mx - 20) + '" y="' + (my - 10) + '" width="40" height="17" rx="4"'
         + ' fill="var(--surface)"/>'
         + '<text x="' + mx + '" y="' + (my + 2) + '" text-anchor="middle" font-size="11.5"'
         + ' font-weight="600" fill="' + (igual ? ACC : "currentColor") + '">'
         + (igual ? "1" : "N" + g.nome) + "</text>";
    });
  } else {
    clientes.forEach(cl => {
      s += '<line x1="' + cl.cx + '" y1="' + (yCli + R) + '" x2="' + centro + '" y2="' + yGlb
         + '" stroke="currentColor" stroke-width="1" opacity="0.55" marker-end="url(#dseta)"/>';
    });
  }

  // nível final -- o modelo global
  s += '<rect x="' + (centro - 110) + '" y="' + yGlb + '" width="220" height="' + hGlb + '" rx="8"'
     + ' fill="var(--surface-2)" stroke="currentColor" stroke-width="1.6"/>'
     + '<text x="' + centro + '" y="' + (yGlb + 28) + '" text-anchor="middle" font-size="13"'
     + ' font-weight="600" fill="currentColor">modelo global</text>';

  // anotações dos hops, na coluna da direita
  const anot = (y, titulo, corpo, destaque) => {
    let t = '<text x="' + ANOT + '" y="' + y + '" font-size="12" font-weight="600" fill="'
          + (destaque ? ACC : "currentColor") + '">' + esc(titulo) + "</text>";
    corpo.forEach((linha, i) => {
      t += '<text x="' + ANOT + '" y="' + (y + 17 + i * 15) + '" font-size="11"'
         + ' fill="currentColor" opacity="0.8">' + esc(linha) + "</text>";
    });
    return t;
  };

  if (agrupado) {
    s += anot(yCli + 12, "1º nível — dentro do grupo",
              ["média ponderada por Nᵢ,", "os exemplos de cada client"], false);
    s += anot(yGrp + 62, "2º nível — entre grupos",
              igual
                ? ["peso 1 por grupo: o Nɡ não cancela,", "e o grupo pequeno pesa igual ao grande"]
                : ["peso Nɡ: cancela com a média interna,", "e o resultado é o FedAvg puro"],
              igual);
  } else {
    s += anot(yCli + 30, "Um nível só",
              ["média ponderada por Nᵢ sobre", "todos os clients — FedAvg puro"], false);
  }

  const rotulo = agrupado
    ? (igual
        ? "Agregação em dois níveis com peso igual por grupo: o segundo nível pesa 1 por grupo."
        : "Agregação em dois níveis com peso por exemplos: o segundo nível pesa Nɡ, que cancela.")
    : "Agregação em um nível: média ponderada por exemplos sobre todos os clients.";

  const legenda = agrupado
    ? (igual
        ? "<b>Peso igual.</b> O número na seta de baixo é 1 para todo grupo. Como o Nɡ deixa de cancelar, "
        + "o grupo D (clients 0 e 1) para de dominar e cai para ¼ do modelo global. "
        + "<b>É a única coisa que muda em relação à simulação de peso por exemplos</b> — mesmo modelo, "
        + "mesmos dados, mesma semente, mesmo sorteio de clients."
        : "<b>Peso por exemplos.</b> O número na seta de baixo é o Nɡ do grupo, e ele cancela com o "
        + "Nɡ que normaliza a média dentro do grupo. Agrupar vira só colocar parênteses numa soma: "
        + "<b>o modelo global é idêntico ao do FedAvg puro</b>.")
    : "<b>FedAvg puro.</b> Sem agrupamento: uma média só, ponderada pelos exemplos de cada client. "
    + "É a mesma conta que a agregação em dois níveis com peso por exemplos produz.";

  const sorteio = parcial
    ? " <b>Participação parcial:</b> " + sorteados + " dos " + c.clients
      + " clients são sorteados por round, e quais varia a cada round. Em ~15% dos rounds um grupo "
      + "inteiro fica sem representante"
      + (igual ? " — sob peso igual os três restantes sobem de ¼ para ⅓ cada." : " — sob peso por exemplos isso não muda nada, porque grupo vazio tem peso zero dos dois lados.")
    : " <b>Participação total:</b> os " + c.clients + " clients treinam em todo round.";

  return '<figure class="diag"><p class="dtitle">Caixa-preta de agregação</p>'
       + '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(rotulo) + '">'
       + s + "</svg>"
       + "<figcaption>" + legenda + sorteio + "</figcaption></figure>";
}

/* ------------------------------------------------------ modelo por tarefa */
function diagramaModelos(sim) {
  const tarefas = sim.runs.map(r => r.id).filter(id => MODELOS[id]);
  if (!tarefas.length) return "";

  const BW = 600, ALT = 62, W = 900;
  const H = tarefas.length * ALT + 8;
  const ACC = "var(--s-sel)";
  let s = "";

  tarefas.forEach((id, i) => {
    const m = MODELOS[id], total = m.base + m.treinavel;
    const fr = m.treinavel / total;
    const wTre = Math.max(3, Math.round(fr * BW));   // mínimo visível: a fatia da LoRA
    const wBase = BW - wTre;                          // é fina demais para 1 px honesto
    const y = i * ALT + 4;

    s += '<text x="0" y="' + (y + 12) + '" font-size="12.5" font-weight="600"'
       + ' fill="currentColor">' + esc(m.nome) + "</text>";
    if (m.base) {
      s += '<rect x="0" y="' + (y + 20) + '" width="' + wBase + '" height="16" rx="3"'
         + ' fill="var(--surface-2)" stroke="var(--axis)" stroke-width="1"/>'
         + '<text x="8" y="' + (y + 32) + '" font-size="10.5" fill="currentColor" opacity="0.75">'
         + "congelado · " + milhar(m.base) + " pesos</text>";
    }
    s += '<rect x="' + (m.base ? wBase : 0) + '" y="' + (y + 20) + '" width="'
       + (m.base ? wTre : BW) + '" height="16" rx="3" fill="' + ACC + '"/>';
    if (!m.base) {
      s += '<text x="8" y="' + (y + 32) + '" font-size="10.5" fill="var(--plane)">'
         + "treinável · " + milhar(m.treinavel) + " pesos (100%)</text>";
    }
    s += '<text x="' + (BW + 12) + '" y="' + (y + 32) + '" font-size="11" font-weight="600"'
       + ' fill="' + ACC + '">↑ ' + milhar(m.treinavel) + " treináveis"
       + (m.base ? " (" + (fr * 100).toFixed(2).replace(".", ",") + "%)" : "") + "</text>";
    s += '<text x="0" y="' + (y + 50) + '" font-size="11" fill="currentColor" opacity="0.75">'
       + esc(m.nota) + "</text>";
  });

  return '<figure class="diag"><p class="dtitle">Modelo de cada tarefa — o que treina e o que viaja</p>'
       + '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Proporção de pesos'
       + ' treináveis em cada modelo: a barra colorida é a parte que é treinada e comunicada.">'
       + s + "</svg>"
       + "<figcaption>A barra é o modelo inteiro; a parte colorida é o que de fato treina — "
       + "<b>e é exatamente o que viaja pela rede a cada round</b>, porque a parte congelada é "
       + "idêntica em todo client e nunca precisa ser enviada. Nas duas tarefas pré-treinadas a "
       + "fatia treinável está desenhada com largura mínima para ficar visível; a porcentagem ao "
       + "lado é a real.</figcaption></figure>";
}

function renderDiagramas() {
  const sim = selSim();
  document.getElementById("diag-agregacao").innerHTML = diagramaAgregacao(sim);
  document.getElementById("diag-modelos").innerHTML = diagramaModelos(sim);
}

/* Preenche tudo que tem data-i18n. Roda a cada render porque trocar de idioma
   nao recarrega a pagina. */
function aplicarTextos() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => {
    el.placeholder = t(el.getAttribute("data-i18n-ph"));
  });
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
}

function renderAll() {
  aplicarTextos();
  renderNav();
  renderRefSelect();
  renderBanner();
  renderDiagramas();
  renderCards();
  renderLegend();
  renderCharts("acc-charts", "accuracy");
  renderCharts("loss-charts", "loss");
  renderVersus();
  renderSummary();
  renderTable();
  renderNotes();
  renderPanorama();
  renderAchados();
  renderPlano();
  document.getElementById("scale-note").textContent = SCALE_MODE === "own"
    ? t("escalaNotaPropria") : t("escalaNotaComum");
}

/* ------------------------------------------------- preservar a seleção
   O polling redesenha a página a cada 3s, e `innerHTML = ...` destrói os nós
   de texto -- junto com qualquer seleção que o leitor esteja arrastando. O
   sintoma é não conseguir copiar nada enquanto uma run está em andamento.

   Duas defesas. A primeira é não redesenhar quando nada mudou: entre dois
   rounds passam dezenas de ticks idênticos, e cada um deles estava jogando o
   DOM fora à toa. A segunda é adiar o redesenho enquanto houver seleção ativa
   no conteúdo, para o caso em que o dado muda no meio do arrasto. */
let ASSINATURA = null;
let PENDENTE = null;

function assinar(payload) {
  // Sem `generated`: ele muda a cada requisição por definição, e usá-lo faria
  // toda comparação dar "mudou".
  const { generated, ...resto } = payload;
  return JSON.stringify(resto);
}

function selecaoAtiva() {
  const selecao = window.getSelection();
  if (!selecao || selecao.isCollapsed || !selecao.rangeCount) return false;
  const conteudo = document.querySelector(".main");
  return !!conteudo &&
    conteudo.contains(selecao.getRangeAt(0).commonAncestorContainer);
}

// Assim que o leitor solta a seleção, o redesenho adiado acontece.
document.addEventListener("selectionchange", () => {
  if (PENDENTE && !selecaoAtiva()) {
    const payload = PENDENTE;
    PENDENTE = null;
    adopt(payload);
  }
});

function adopt(payload) {
  const assinatura = assinar(payload);
  if (LAST && assinatura === ASSINATURA) return;   // nada mudou: não mexe no DOM
  if (LAST && selecaoAtiva()) { PENDENTE = payload; return; }
  ASSINATURA = assinatura;
  LAST = payload;
  document.getElementById("brand").textContent = tr(LAST, "titulo");
  document.getElementById("brand-sub").textContent = tr(LAST, "subtitulo");

  if (!SIM_ID || !simById(SIM_ID)) {
    const wanted = readHash();
    if (wanted.lang === "en" || wanted.lang === "pt") LANG = wanted.lang;
    SIM_ID = (wanted.sim && simById(wanted.sim)) ? wanted.sim : LAST.simulacoes[0].id;
    const suggested = selSim().compare_to;
    REF_ID = (wanted.ref && simById(wanted.ref)) ? wanted.ref
      : (suggested && simById(suggested)) ? suggested : null;
    writeHash();
  }
  if (REF_ID && !simById(REF_ID)) REF_ID = null;
  renderAll();
}

async function tick() {
  try {
    adopt(SNAPSHOT);
    const running = LAST.simulacoes.flatMap(s => s.runs).filter(r => r.status === "running").length;
    const text = t("snapshotDe") + " " +
      (LANG === "en" ? SNAPSHOT_STAMP_EN : SNAPSHOT_STAMP_PT) +
      (running ? " · " + running + " " + t("aindaRodava") : " · " + t("todasConcluidas"));
    document.getElementById("stamp").textContent = text;
    document.getElementById("side-stamp").textContent = text;
  } catch (error) {
    document.getElementById("stamp").textContent = t("falhaSnapshot") + error.message;
  }
}

/* ============================================================ controles */
function setScale(mode) {
  SCALE_MODE = mode;
  document.getElementById("sc-own").setAttribute("aria-pressed", String(mode === "own"));
  document.getElementById("sc-common").setAttribute("aria-pressed", String(mode === "common"));
  if (LAST) renderAll();
}
document.getElementById("sc-own").onclick = () => setScale("own");
document.getElementById("sc-common").onclick = () => setScale("common");

document.getElementById("ref-select").onchange = event => {
  REF_ID = event.target.value || null;
  writeHash();
  renderAll();
};

const filterInput = document.getElementById("sim-filter");
const filterClear = document.getElementById("sim-filter-clear");
filterInput.oninput = () => {
  FILTER = filterInput.value.trim().toLowerCase();
  filterClear.classList.toggle("hidden", !FILTER);
  if (LAST) renderNav();
};
filterClear.onclick = () => {
  filterInput.value = "";
  filterInput.dispatchEvent(new Event("input"));
  filterInput.focus();
};

document.getElementById("plan-jump").onclick = () => {
  document.getElementById("planejamento")
    .scrollIntoView({ behavior: "smooth", block: "start" });
};

document.getElementById("lang").onclick = () => {
  LANG = LANG === "en" ? "pt" : "en";
  writeHash();
  // A assinatura nao mudou, mas o texto sim: renderAll direto em vez de adopt.
  if (LAST) renderAll();
  else aplicarTextos();
};

document.getElementById("theme").onclick = () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
};

tick();

</script>
</body>
