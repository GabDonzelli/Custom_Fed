<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FL — painel de simulações</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f2ee;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    /* Duas séries, e o que elas significam é sempre o mesmo: azul = a simulação
       selecionada, laranja = a simulação de referência. Slots 1 e 2 da paleta
       documentada; validados all-pairs nos dois temas. */
    --s-sel: #2a78d6;
    --s-ref: #eb6834;
    --good: #0ca30c;
    --warn: #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --ink: #ffffff;
      --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --s-sel: #3987e5; --s-ref: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --ink: #ffffff;
    --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --s-sel: #3987e5; --s-ref: #d95926;
  }

  * { box-sizing: border-box; }
  /* O navegador nao deixa arrastar uma selecao de dentro de <button>, e os
     itens da barra lateral sao botoes -- entao os rotulos das simulacoes e das
     tarefas ficavam impossiveis de copiar. Devolver `user-select` nao atrapalha
     o clique: arrastar seleciona, clicar continua navegando. */
  .sim, .runs button, .planned-item { user-select: text; -webkit-user-select: text; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .shell { display: flex; align-items: flex-start; gap: 0; min-height: 100vh; }

  /* =========================================================== barra lateral
     O eixo de navegação é a simulação. Cada item carrega a configuração no
     próprio rótulo -- "10 clients · 20 rounds · 4 grupos" -- porque é isso que
     distingue duas simulações do mesmo modelo, e obrigar a abrir cada uma para
     descobrir a configuração é o que a barra existe para evitar. */
  .side {
    width: 288px; flex: none; position: sticky; top: 0; height: 100vh;
    overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border);
    padding: 22px 14px 28px;
  }
  .side h2 {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--muted); margin: 24px 0 8px; display: flex; align-items: baseline; gap: 6px;
  }
  .side h2 .count { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .brand { font-size: 13px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11.5px; color: var(--muted); margin: 0 0 16px; }

  .filter { position: relative; }
  .filter input {
    width: 100%; font: inherit; font-size: 12px; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 26px 6px 10px;
  }
  .filter input::placeholder { color: var(--muted); }
  .filter input:focus { outline: 2px solid color-mix(in srgb, var(--s-sel) 55%, transparent); outline-offset: 1px; }
  .filter .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit;
    font-size: 15px; line-height: 1; padding: 2px 6px;
  }

  .simgroup { margin-bottom: 2px; }
  .simgroup > .gname {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); padding: 0 4px; margin: 14px 0 6px;
  }

  .sim {
    display: block; width: 100%; text-align: left; cursor: pointer; margin-bottom: 5px;
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    padding: 9px 10px; font: inherit; color: var(--ink-2);
  }
  .sim:hover { background: var(--surface-2); }
  .sim[aria-current="true"] {
    background: var(--surface-2); border-color: var(--border); color: var(--ink);
    box-shadow: inset 3px 0 0 var(--s-sel);
  }
  .sim .stop { display: flex; align-items: center; gap: 6px; }
  .sim .sname { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sim .sstate {
    margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; white-space: nowrap; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 6px;
  }
  .sim .sstate.done { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
  .sim .sstate.running { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  /* A configuração é a linha que diferencia as simulações entre si, então ela
     ganha tabular-nums e fica sempre visível, não só na selecionada. */
  .sim .scfg {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .sim[aria-current="true"] .scfg { color: var(--ink-2); }
  .sim .sfrac { font-size: 10.5px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; }

  .runs { list-style: none; margin: 1px 0 12px; padding: 0 0 0 6px; }
  .runs li { margin: 0; }
  .runs button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: 0; border-left: 2px solid var(--grid);
    padding: 5px 8px 5px 12px; font: inherit; font-size: 12px; color: var(--ink-2);
    cursor: pointer; border-radius: 0 6px 6px 0;
  }
  .runs button:hover { background: var(--surface-2); color: var(--ink); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--axis); }
  .dot.running { background: var(--warn); }
  .dot.done { background: var(--good); }
  .dot.interrupted { background: var(--muted); }
  .dot.planned { background: transparent; box-shadow: inset 0 0 0 1.5px var(--axis); }
  .runs .rlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runs .rorigin { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; }

  .planned-item { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); margin-bottom: 6px; }
  .planned-item .pl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .planned-item .pd { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* O planejamento vale para o projeto inteiro, entao a barra lateral so
     mostra o placar e leva ate a secao -- a lista marcavel vive no conteudo,
     onde ha largura para o texto que explica cada item. */
  .plan-jump {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    font: inherit; font-size: 12px; color: var(--ink-2); cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
  }
  .plan-jump:hover { color: var(--ink); }
  .plan-jump .plan-seta { margin-left: auto; color: var(--muted); }

  .side-empty { font-size: 11.5px; color: var(--muted); padding: 10px 4px; }
  .side-foot { margin-top: 24px; font-size: 11px; color: var(--muted); }
  .side-foot button {
    font: inherit; font-size: 11px; color: var(--ink-2); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }

  /* ================================================================ conteúdo */
  .main { flex: 1 1 auto; min-width: 0; padding: 26px 26px 72px; max-width: 1240px; }
  header.page { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 22px; line-height: 1.22; margin: 0 0 5px; letter-spacing: -0.015em; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0; max-width: 76ch; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stamp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  button.ctl, select.ctl {
    font: inherit; font-size: 12px; color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  button.ctl:hover, select.ctl:hover { color: var(--ink); }
  button.ctl[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .refpick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

  /* Faixa que diz, sem ambiguidade, qual simulação está na tela. */
  .banner {
    border: 1px solid var(--border); border-left: 3px solid var(--s-sel);
    background: var(--surface); border-radius: 12px; padding: 15px 18px; margin-bottom: 20px;
  }
  .banner .btag {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--s-sel);
  }
  .banner .btitle { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 3px 0 6px; }
  .banner .bsum { font-size: 13px; color: var(--ink-2); margin: 0; max-width: 88ch; }
  /* Aviso operacional (fila pausada, run concorrente). Amarelo de status, com
     texto próprio -- nunca cor sozinha carregando o significado. */
  .banner .bnotice {
    font-size: 12.5px; color: var(--ink-2); margin: 11px 0 0; max-width: 88ch;
    background: color-mix(in srgb, var(--warn) 11%, transparent);
    border-left: 2px solid var(--warn); border-radius: 0 7px 7px 0; padding: 8px 11px;
  }
  .banner .bnotice::before {
    content: "Aviso · "; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; font-size: 10.5px; color: var(--ink-2);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--ink-2); background: var(--surface-2); font-variant-numeric: tabular-nums;
  }
  .chip b { font-weight: 600; color: var(--ink); }

  /* Ficha técnica em pares nome/valor. Duas colunas na faixa, onde há largura
     e o texto é longo; uma coluna nos cartões, que são estreitos. O rótulo em
     caixa alta pequena mantém a hierarquia sem competir com o valor. */
  .ficha {
    display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px;
    margin: 14px 0 0; padding-top: 13px; border-top: 1px solid var(--border);
  }
  .ficha dt {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--muted); padding-top: 1px;
    white-space: nowrap;
  }
  .ficha dd {
    margin: 0; font-size: 12.5px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  /* A exceção fica sob o valor padrão, recessiva: o padrão é o que se lê
     primeiro, a exceção é a nota de rodapé que impede a leitura errada. */
  .ficha .excecao {
    display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px;
  }
  .ficha.compacta { margin-top: 12px; padding-top: 11px; gap: 3px 10px; }
  .ficha.compacta dt { font-size: 9.5px; }
  .ficha.compacta dd { font-size: 12px; }
  @media (max-width: 620px) {
    .ficha { grid-template-columns: 1fr; gap: 1px; }
    .ficha dt { margin-top: 8px; }
  }

  h2.sec { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
           color: var(--muted); margin: 34px 0 12px; }
  .note { font-size: 12px; color: var(--muted); margin: -6px 0 12px; max-width: 96ch; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  figure.diag { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--border);
                border-radius: 12px; padding: 15px; overflow-x: auto; }
  figure.diag svg { max-width: 100%; height: auto; display: block; color: var(--ink-2); }
  figure.diag figcaption { font-size: 11.5px; color: var(--muted); margin-top: 10px; line-height: 1.55; }
  figure.diag figcaption b { color: var(--ink-2); font-weight: 600; }
  figure.diag .dtitle { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 10px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
  .card h3 { font-size: 13.5px; margin: 0 0 3px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .meta { font-size: 11.5px; color: var(--muted); margin: 0 0 12px; }

  .pill { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
          color: var(--ink-2); font-weight: 500; white-space: nowrap; }
  .pill.running { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.done { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
  .pill.interrupted { color: var(--muted); border-color: color-mix(in srgb, var(--muted) 45%, transparent);
                      text-decoration: line-through; }
  .badge {
    font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase; font-weight: 600;
    padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--border);
  }

  .hero { font-size: 29px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .hero small { font-size: 12.5px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .delta { font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }

  .bar { height: 5px; border-radius: 3px; background: var(--grid); overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--s-sel); }
  .barlab { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted);
            margin-top: 6px; font-variant-numeric: tabular-nums; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 0; border-top-width: 2px; border-top-style: solid; display: inline-block; }

  .chartbox { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.13);
    white-space: nowrap; z-index: 5; font-variant-numeric: tabular-nums;
  }
  .tip b { font-weight: 600; }
  .tip .k { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  /* A ficha tecnica tem descricoes de arquitetura longas demais para
     caber numa linha: nessas celulas o texto quebra e alinha a esquerda. */
  #summary td { white-space: normal; text-align: left; min-width: 20ch; max-width: 42ch; }
  #summary td:first-child { min-width: 24ch; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
             font-weight: 600; border-bottom: 1px solid var(--axis); }
  thead tr.group th { text-align: center; padding-bottom: 3px; border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  td.empty { color: var(--muted); }
  td.best { font-weight: 600; }
  td.best::after { content: " \25CF"; font-size: 8px; vertical-align: 2px; }
  tr.r0 td { color: var(--ink-2); font-style: italic; }
  .tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
               padding: 6px 8px 2px; overflow-x: auto; }
  .up { color: var(--good); }
  .down { color: var(--s-ref); }

  .empty-panel { display: flex; align-items: center; justify-content: center; height: 150px;
                 color: var(--muted); font-size: 12.5px; border: 1px dashed var(--grid); border-radius: 8px;
                 text-align: center; padding: 0 16px; }

  .prose { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
           padding: 4px 20px 18px; max-width: 100ch; }
  .prose h4 { font-size: 13px; margin: 20px 0 5px; }
  .prose p { font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }
  .prose code { font-size: 11.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  /* ------------------------------------------------------- planejamento */
  .prose .plan-aviso {
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border-left: 2px solid var(--warn); border-radius: 0 7px 7px 0;
    padding: 8px 11px; margin: 0 0 8px;
  }
  .plano { list-style: none; margin: 14px 0 0; padding: 0; max-width: 100ch; }
  .plan-item {
    display: flex; gap: 11px; align-items: flex-start; padding: 12px 15px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 11px; margin-bottom: 8px;
  }
  /* Concluido recua sem sumir: continua legivel, mas para de disputar atencao
     com o que ainda falta fazer. Nunca so a cor -- o risco no titulo e a caixa
     marcada dizem o mesmo sem depender de enxergar verde. */
  .plan-item.feito { background: var(--surface-2); }
  .plan-item.feito .plan-titulo { text-decoration: line-through; color: var(--muted); }
  .plan-item.feito .plan-detalhe { color: var(--muted); }
  .plan-item input[type="checkbox"] {
    width: 17px; height: 17px; margin: 1px 0 0; flex: none; cursor: pointer;
    accent-color: var(--good);
  }
  .plan-corpo { min-width: 0; }
  .plan-titulo { font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .plan-eixo {
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    font-weight: 600; color: var(--muted); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; margin-left: 8px; white-space: nowrap;
  }
  .plan-detalhe { font-size: 12.5px; color: var(--ink-2); margin: 5px 0 0; }

  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .side { position: static; width: 100%; height: auto; border-right: 0;
            border-bottom: 1px solid var(--border); }
    .main { padding: 20px 16px 56px; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- ================================================== barra lateral -->
  <nav class="side" aria-label="Simulações">
    <p class="brand" id="brand">Aprendizado federado</p>
    <p class="brand-sub" id="brand-sub">Painel de simulações</p>

    <div class="filter">
      <input id="sim-filter" type="search" data-i18n-ph="filtro"
             aria-label="Filtrar simulações" autocomplete="off">
      <button class="clear hidden" id="sim-filter-clear" type="button" aria-label="Limpar filtro">&times;</button>
    </div>

    <h2><span data-i18n="simulacoes"></span> <span class="count" id="sim-count"></span></h2>
    <div id="sim-nav"></div>

    <h2><span data-i18n="planejamento"></span> <span class="count" id="plan-count"></span></h2>
    <button class="plan-jump" id="plan-jump" type="button">
      <span id="plan-resumo">—</span>
      <span class="plan-seta">↓</span>
    </button>

    <div class="side-foot">
      <button class="ctl" id="lang" type="button" data-i18n="idioma"></button>
      <button class="ctl" id="theme" type="button" data-i18n="tema"></button>
      <p style="margin:10px 0 0" id="side-stamp">carregando…</p>
    </div>
  </nav>

  <!-- ======================================================= conteúdo -->
  <main class="main">
    <header class="page">
      <div>
        <h1 id="page-title">—</h1>
      </div>
      <div class="head-right">
        <label class="refpick"><span data-i18n="compararCom"></span>
          <select class="ctl" id="ref-select"></select>
        </label>
        <span class="stamp" id="stamp"></span>
      </div>
    </header>

    <div class="banner" id="banner"></div>

    <section id="diagramas">
      <h2 class="sec" data-i18n="oQueFaz"></h2>
      <div id="diag-agregacao"></div>
      <div id="diag-modelos"></div>
    </section>

    <!-- Panorama e achados valem para o projeto todo, nao para a simulacao
         na tela, mas vem cedo: sao a sintese que o leitor quer primeiro. -->
    <section id="panorama-section">
      <h2 class="sec" data-i18n="panorama"></h2>
      <p class="note" id="panorama-nota"></p>
      <div class="tablewrap"><table id="panorama"></table></div>
    </section>

    <section id="achados-section">
      <h2 class="sec" data-i18n="achados"></h2>
      <div class="prose" id="achados"></div>
    </section>

    <h2 class="sec" data-i18n="resultadoPorTarefa"></h2>

cy": 0.226595, "loss": 4.689785, "clients": 10, "timestamp": "2026-09-04T17:00:03.256462"}, {"round": 11, "accuracy": 0.226228, "loss": 4.687069, "clients": 10, "timestamp": "2026-09-04T17:06:40.421485"}, {"round": 12, "accuracy": 0.226641, "loss": 4.68323, "clients": 10, "timestamp": "2026-09-04T17:13:43.762053"}, {"round": 13, "accuracy": 0.226664, "loss": 4.679051, "clients": 10, "timestamp": "2026-09-04T17:20:25.933624"}, {"round": 14, "accuracy": 0.226756, "loss": 4.676805, "clients": 10, "timestamp": "2026-09-04T17:39:19.394374"}, {"round": 15, "accuracy": 0.226824, "loss": 4.672859, "clients": 10, "timestamp": "2026-09-04T17:58:48.700221"}, {"round": 16, "accuracy": 0.226962, "loss": 4.670373, "clients": 10, "timestamp": "2026-09-04T18:18:23.012823"}, {"round": 17, "accuracy": 0.22671, "loss": 4.669486, "clients": 10, "timestamp": "2026-09-04T18:37:50.888677"}, {"round": 18, "accuracy": 0.22726, "loss": 4.665934, "clients": 10, "timestamp": "2026-09-04T18:57:54.705274"}, {"round": 19, "accuracy": 0.227421, "loss": 4.665353, "clients": 10, "timestamp": "2026-09-04T19:19:03.640369"}, {"round": 20, "accuracy": 0.227696, "loss": 4.663845, "clients": 10, "timestamp": "2026-09-04T19:40:06.487128"}], "last_round": 20, "baseline": 0.198454, "final": 0.227696, "final_loss": 4.663845, "best": {"round": 20, "accuracy": 0.227696, "loss": 4.663845, "clients": 10, "timestamp": "2026-09-04T19:40:06.487128"}, "clients_last": 10, "client_counts": [10], "elapsed": 16918.345812}], "counts": {"done": 4, "running": 0, "interrupted": 0, "pending": 0, "planned": 0}, "state": "done"}, {"id": "partial07-10c-20r", "grupo": "regua", "label": "FedAvg agrupado — parcial 0,7 · SEM semente", "compare_to": "full-10c-20r", "config": {"clients": 10, "rounds": 20, "groups": 4, "fraction_train": 0.7, "fraction_evaluate": 0.7, "strategy": "Grouped FedAvg", "seed": null, "extra": [{"k": "equivale a", "k_en": "equivalent to", "v": "FedAvg puro", "v_en": "plain FedAvg"}, {"k": "min-train-nodes", "v": "7", "k_en": "min-train-nodes", "v_en": "7"}, {"k": "min-evaluate-nodes", "v": "7", "k_en": "min-evaluate-nodes", "v_en": "7"}, {"k": "grupos vazios", "v": "12 de 80 rounds medidos (15%)", "k_en": "empty groups", "v_en": "12 of 80 rounds measured (15%)"}, {"k": "determinismo", "v": "SEM semente", "k_en": "determinism", "v_en": "NO seed"}, {"k": "algoritmo efetivo", "v": "≡ FedAvg puro (a média de dois níveis telescopa)", "k_en": "algoritmo efetivo", "v_en": "≡ FedAvg puro (a média de dois níveis telescopa)"}], "strategy_en": "Grouped FedAvg"}, "summary": "7 dos 10 clients sorteados por round, sorteio novo a cada round, nas fases de treino e de avaliação.", "notes": [{"title": "Esta simulação é FedAvg puro, com outro nome", "title_en": "This simulation is plain FedAvg under another name", "body": "A agregação em dois níveis com peso proporcional aos exemplos <b>telescopa<\/b>: o <code>N_g<\/code> que pondera o grupo cancela com o <code>N_g<\/code> que normaliza a média dentro dele, e sobra a média ponderada de todos os clients — que é o FedAvg puro. Agrupar aqui é apenas colocar parênteses numa soma. Verificado numericamente (<code>1e-16<\/code>) e rodando o treino inteiro com a mesma semente (idêntico até a última casa). Então <b>não espere<\/b> que esta simulação difira das outras marcadas com o mesmo <i>equivale a<\/i>: quando diferem, a diferença é ruído de execução, não método.", "body_en": "Two-level aggregation with example-proportional weights <b>telescopes<\/b>: the <code>N_g<\/code> weighting the group cancels the <code>N_g<\/code> normalizing the mean inside it, leaving the example-weighted mean over all clients — which is plain FedAvg. Grouping here is just putting parentheses around a sum. Verified numerically (<code>1e-16<\/code>) and by running the full training with the same seed (identical to the last digit). So <b>do not expect<\/b> this simulation to differ from the others tagged with the same <i>equivalent to<\/i>: when they differ, the difference is run-to-run noise, not method."}, {"title": "O que a participação parcial faz, concretamente", "body": "A cada round o servidor sorteia 7 dos 10 clients para treinar e 7 para avaliar — sorteio independente, refeito em todo round. Um client fora do sorteio não treina naquele round e não contribui para o modelo global. A coluna <code>num_clients_trained<\/code> do CSV é a prova de que isso aconteceu: ela lê 7, não 10."}, {"title": "Agrupar não muda o modelo — nem aqui, nem em participação parcial", "body": "A agregação em dois níveis pondera os clients pelos exemplos dentro do grupo e depois pondera os grupos pelos exemplos deles. Essa composição se cancela: o resultado é exatamente a média ponderada por exemplos de todos os clients sorteados, que é o FedAvg puro. Verificado numericamente em 07/09/2026 contra o <code>TrackedFedAvg<\/code> da branch <code>baseline-fedavg<\/code>, com os grupos reais [2,3,7] [5,6,8] [4,9] [0,1]: diferença máxima de <code>1e-16<\/code> (precisão de máquina) em participação total, em parcial 7/10, e com um ou dois grupos vazios. Pular um grupo vazio não quebra a identidade — um grupo sem client tem peso zero de qualquer forma. Consequência: nesta implementação o agrupamento é contabilidade, não método; ele muda o que aparece no log, não o modelo global."}, {"title": "A armadilha que quase anula o experimento", "body": "O Flower sorteia <code>max(int(clients_conectados × fraction_train), min_train_nodes)<\/code>. Com <code>min-train-nodes = 10<\/code> herdado da configuração de participação total, pôr <code>fraction-train = 0.7<\/code> não muda nada: os 10 clients são sorteados de todo jeito e a run mente na configuração. Por isso os mínimos foram baixados para 7, junto com as frações."}, {"title": "Grupo vazio: um caso que só aparece com participação parcial", "body": "O sorteio ignora os grupos. Com 10 partições em 4 grupos (tamanhos 3, 3, 2, 2) e 7 clients sorteados, algum grupo fica sem nenhum client em cerca de 15% dos rounds — ou seja, em quase toda run de 20 rounds. O código original levantava <code>ValueError<\/code> nesse caso e a run morria; agora o grupo sem client é simplesmente pulado, e a agregação grupo para global pesa apenas os grupos que treinaram."}, {"title": "Os dois painéis de CIFAR-10 não são medidos no mesmo conjunto de teste", "body": "A CNN do zero é avaliada nas <code>10.000<\/code> imagens do test split completo; o probe da ResNet-18 congelada, em <code>1.000<\/code> (o <code>MAX_CENTRALIZED_IMAGES = 1000<\/code> existe porque cada imagem tem de atravessar o backbone congelado na CPU). Consequência prática: a accuracy do probe tem resolução de 0,1 p.p. e erro padrão de <b>≈1,2 p.p.<\/b>, então diferenças de menos de ~2 p.p. entre simulações nesse painel são ruído de amostragem do conjunto de teste, não efeito da configuração. No painel da CNN o erro padrão é ≈0,5 p.p."}], "label_en": "Grouped FedAvg — partial 0.7 · NO seed", "summary_en": "7 of the 10 clients are sampled per round, redrawn independently every round, for both the train and the evaluate phase.", "runs": [{"id": "cifar10", "origin": "scratch", "label": "CIFAR-10 — CNN do zero", "metric": "Accuracy de classificação (10 classes)", "chance": 0.1, "csv": "fl_results_2026_09_04_194123.csv", "eval_set": "10.000 imagens (test split completo do CIFAR-10)", "queued": true, "hyper": {"Modelo": "CNN do quickstart Flower — conv(3→6, 5×5) · maxpool 2×2 · conv(6→16, 5×5) · maxpool 2×2 · fc 400→120→84→10", "Pesos iniciais": "aleatórios (treinada do zero)", "Otimizador": "SGD, momentum 0,9", "Learning rate": "0,1", "Batch size": "32", "Épocas locais": "1", "Dados por client": "4.000 imagens (partição de 5.000, split 80/20)", "Particionamento": "IID (IidPartitioner)", "Pré-processamento": "ToTensor · Normalize(0,5 | 0,5)", "Comunicado por round": "62.006 pesos — o modelo inteiro"}, "label_en": "CIFAR-10 — CNN from scratch", "metric_en": "Classification accuracy (10 classes)", "eval_set_en": "10,000 images (full CIFAR-10 aqui é apenas colocar parênteses numa soma. Verificado numericamente (<code>1e-16<\/code>) e rodando o treino inteiro com a mesma semente (idêntico até a última casa). Então <b>não espere<\/b> que esta simulação difira das outras marcadas com o mesmo <i>equivale a<\/i>: quando diferem, a diferença é ruído de execução, não método.", "body_en": "Two-level aggregation with example-proportional weights <b>telescopes<\/b>: the <code>N_g<\/code> weighting the group cancels the <code>N_g<\/code> normalizing the mean inside it, leaving the example-weighted mean over all clients — which is plain FedAvg. Grouping here is just putting parentheses around a sum. Verified numerically (<code>1e-16<\/code>) and by running the full training with the same seed (identical to the last digit). So <b>do not expect<\/b> this simulation to differ from the others tagged with the same <i>equivalent to<\/i>: when they differ, the difference is run-to-run noise, not method."}, {"title": "O que estamos testando: quanto cada grupo pesa", "body": "Os 10 clients estão repartidos em 4 grupos fixos — <code>[2,3,7]<\/code>, <code>[5,6,8]<\/code>, <code>[4,9]<\/code>, <code>[0,1]<\/code>. O modelo global sai de uma média em dois níveis: primeiro os clients viram um modelo por grupo, depois os grupos viram o modelo global. A pergunta é <b>quanto cada grupo pesa nessa segunda etapa<\/b>, e há duas respostas possíveis. Estas simulações rodam as duas, com a mesma semente, os mesmos dados e os mesmos clients sorteados — para que a única diferença seja o peso."}, {"title": "Peso por exemplos: agrupar é só colocar parênteses", "body": "Se cada grupo pesa o total de exemplos que trouxe, a conta se desfaz. Dentro do grupo, a média divide por <code>N_g<\/code>, o total de exemplos dele; entre grupos, multiplica por <code>N_g<\/code> de novo. Os dois se cancelam, e sobra a média ponderada de todos os clients — que é exatamente o FedAvg puro. É a diferença entre <code>(a+b) + (c+d)<\/code> e <code>a+b+c+d<\/code>: <b>parênteses não mudam uma soma<\/b>. Confirmamos isso de duas formas em 07/09/2026: pela álgebra (diferença de <code>1e-16<\/code>) e rodando o treino inteiro (idêntico até a última casa). Nesse modo o agrupamento aparece no log e não move o modelo."}, {"title": "Peso igual: quando o grupo passa a significar algo", "body": "Se todo grupo pesa <code>1<\/code>, o <code>N_g<\/code> não cancela mais e o modelo global muda de verdade. Um grupo com 500 exemplos passa a influenciar tanto quanto um com 12.000. É o que dá sentido a grupo como <b>unidade real<\/b> — região, hospital, operadora — em vez de rótulo. E ataca um problema concreto destes dados: no Stack Exchange um único autor detém 54% dos exemplos e, sob peso por exemplos, arrasta o modelo global sozinho; sob peso igual, ele fica limitado à fatia do grupo dele."}, {"title": "Grupo vazio: um detalhe que muda de importância", "body": "O sorteio de clients ignora os grupos. Com 7 de 10 sorteados, algum grupo fica sem ninguém em <b>15% dos rounds<\/b> — número que calculamos exato e que bateu com os 12 de 80 rounds medidos. Um grupo de 2 clients fica vazio oito vezes mais que um de 3, então grupos desiguais são desigualmente frágeis. Sob peso por exemplos isso não muda nada (grupo vazio tem peso zero dos dois lados da conta). Sob <b>peso igual<\/b>, muda: com 4 grupos e um vazio, os três restantes sobem de <code>1/4<\/code> para <code>1/3<\/code> cada. O grupo ausente passa a redistribuir influência."}, {"title": "Como ler a comparação", "body": "Cada simulação de peso igual tem como referência a de peso por exemplos na mesma fração — é a linha tracejada laranja dos gráficos e a segunda coluna da tabela de comparação. Como as duas são semeadas e partem dos mesmos pesos iniciais, <b>qualquer diferença é do peso<\/b>, não de sorte. Não há mais margem de ruído a descontar: se as curvas se separam, o agrupamento está fazendo alguma coisa."}], "label_en": "FedAvg, example-weighted — full · seeded", "summary_en": "Each group weighs in proportion to the examples it contributed. This two-level mean telescopes: the result is identical to plain FedAvg, and it serves here as the baseline against equal weighting.", "runs": [{"id": "cifar10-pretrained", "origin": "pretrained", "label": "CIFAR-10 — ResNet-18 congelada", "metric": "Accuracy de classificação (10 classes)", "chance": 0.1, "csv": "fl_results_2026_09_08_103342.csv", "eval_set": "1.000 imagens (MAX_CENTRALIZED_IMAGES = 1000)", "hyper": {"Modelo": "ResNet-18 da torchvision congelada (11,2M pesos, em eval, sem a cabeça ImageNet) → features 512-d normalizadas em L2 → head treinável nn.Linear(512, 10)", "Pesos iniciais": "ResNet18_Weights.IMAGENET1K_V1 (backbone) · head aleatório", "Otimizador": "SGD, momentum 0,9", "Learning rate": "1,0", "Batch size": "32", "Épocas locais": "1", "Dados por client": "500 imagens (MAX_IMAGES_PER_CLIENT)", "Particionamento": "IID (IidPartitioner)", "Pré-processamento": "Resize 224 · Normalize ImageNet (0,485/0,456/0,406)", "Comunicado por round": "5.130 pesos — só o head linear"}, "queued": true, "label_en": "CIFAR-10 — frozen ResNet-18", "metric_en": "Classification accuracy (10 classes)", "eval_set_en": "1,000 images (MAX_CENTRALIZED_IMAGES = 1000)", "hyper_en": {"Model": "torchvision ResNet-18, frozen (11.2M weights, in eval, ImageNet head removed) → L2-normalized 512-d features → trainable nn.Linear(512, 10) head", "Initial weights": "ResNet18_Weights.IMAGENET1K_V1 (backbone) · random head", "Optimizer": "SGD, momentum 0.9", "Learning rate": "1.0", "Batch size": "32", "Local epochs": "1", "Data per client": "500 images (MAX_IMAGES_PER_CLIENT)", "Partitioning": "IID (IidPartitioner)", "Preprocessing": "Resize 224 · ImageNet Normalize (0.485/0.456/0.406)", "Communicated per round": "5,130 weights — the linear head only"}, "status": "done", "rows": [{"round": 0, "accuracy": 0.12, "loss": 2.30098, "clients": null, "timestamp": "2026-09-08T10:33:42.092143"}, {"round": 1, "accuracy": 0.601, "loss": 1 ode>, <code>[5,6,8]<\/code>, <code>[4,9]<\/code>, <code>[0,1]<\/code>. O modelo global sai de uma média em dois níveis: primeiro os clients viram um modelo por grupo, depois os grupos viram o modelo global. A pergunta é <b>quanto cada grupo pesa nessa segunda etapa<\/b>, e há duas respostas possíveis. Estas simulações rodam as duas, com a mesma semente, os mesmos dados e os mesmos clients sorteados — para que a única diferença seja o peso."}, {"title": "Peso por exemplos: agrupar é só colocar parênteses", "body": "Se cada grupo pesa o total de exemplos que trouxe, a conta se desfaz. Dentro do grupo, a média divide por <code>N_g<\/code>, o total de exemplos dele; entre grupos, multiplica por <code>N_g<\/code> de novo. Os dois se cancelam, e sobra a média ponderada de todos os clients — que é exatamente o FedAvg puro. É a diferença entre <code>(a+b) + (c+d)<\/code> e <code>a+b+c+d<\/code>: <b>parênteses não mudam uma soma<\/b>. Confirmamos isso de duas formas em 07/09/2026: pela álgebra (diferença de <code>1e-16<\/code>) e rodando o treino inteiro (idêntico até a última casa). Nesse modo o agrupamento aparece no log e não move o modelo."}, {"title": "Peso igual: quando o grupo passa a significar algo", "body": "Se todo grupo pesa <code>1<\/code>, o <code>N_g<\/code> não cancela mais e o modelo global muda de verdade. Um grupo com 500 exemplos passa a influenciar tanto quanto um com 12.000. É o que dá sentido a grupo como <b>unidade real<\/b> — região, hospital, operadora — em vez de rótulo. E ataca um problema concreto destes dados: no Stack Exchange um único autor detém 54% dos exemplos e, sob peso por exemplos, arrasta o modelo global sozinho; sob peso igual, ele fica limitado à fatia do grupo dele."}, {"title": "Grupo vazio: um detalhe que muda de importância", "body": "O sorteio de clients ignora os grupos. Com 7 de 10 sorteados, algum grupo fica sem ninguém em <b>15% dos rounds<\/b> — número que calculamos exato e que bateu com os 12 de 80 rounds medidos. Um grupo de 2 clients fica vazio oito vezes mais que um de 3, então grupos desiguais são desigualmente frágeis. Sob peso por exemplos isso não muda nada (grupo vazio tem peso zero dos dois lados da conta). Sob <b>peso igual<\/b>, muda: com 4 grupos e um vazio, os três restantes sobem de <code>1/4<\/code> para <code>1/3<\/code> cada. O grupo ausente passa a redistribuir influência."}, {"title": "Como ler a comparação", "body": "Cada simulação de peso igual tem como referência a de peso por exemplos na mesma fração — é a linha tracejada laranja dos gráficos e a segunda coluna da tabela de comparação. Como as duas são semeadas e partem dos mesmos pesos iniciais, <b>qualquer diferença é do peso<\/b>, não de sorte. Não há mais margem de ruído a descontar: se as curvas se separam, o agrupamento está fazendo alguma coisa."}], "label_en": "Equal-weight groups — full · seeded", "summary_en": "Every group weighs the same in the group→global step, regardless of how much data it holds. This is the setting where grouping stops being bookkeeping and starts changing the model.", "runs": [{"id": "cifar10-pretrained", "origin": "pretrained", "label": "CIFAR-10 — ResNet-18 congelada", "metric": "Accuracy de classificação (10 classes)", "chance": 0.1, "csv": "fl_results_2026_09_08_104247.csv", "eval_set": "1.000 imagens (MAX_CENTRALIZED_IMAGES = 1000)", "hyper": {"Modelo": "ResNet-18 da torchvision congelada (11,2M pesos, em eval, sem a cabeça ImageNet) → features 512-d normalizadas em L2 → head treinável nn.Linear(512, 10)", "Pesos iniciais": "ResNet18_Weights.IMAGENET1K_V1 (backbone) · head aleatório", "Otimizador": "SGD, momentum 0,9", "Learning rate": "1,0", "Batch size": "32", "Épocas locais": "1", "Dados por client": "500 imagens (MAX_IMAGES_PER_CLIENT)", "Particionamento": "IID (IidPartitioner)", "Pré-processamento": "Resize 224 · Normalize ImageNet (0,485/0,456/0,406)", "Comunicado por round": "5.130 pesos — só o head linear"}, "queued": true, "label_en": "CIFAR-10 — frozen ResNet-18 _evaluate": 0.7, "strategy": "Grouped FedAvg", "seed": 42, "extra": [{"k": "equivale a", "k_en": "equivalent to", "v": "FedAvg puro", "v_en": "plain FedAvg"}, {"k": "peso grupo→global", "v": "proporcional aos exemplos", "k_en": "group→global weight", "v_en": "proportional to examples"}, {"k": "min-train-nodes", "v": "7", "k_en": "min-train-nodes", "v_en": "7"}, {"k": "determinismo", "v": "semeado (seed 42)", "k_en": "determinism", "v_en": "seeded (seed 42)"}, {"k": "algoritmo efetivo", "v": "≡ FedAvg puro (a média de dois níveis telescopa)", "k_en": "algoritmo efetivo", "v_en": "≡ FedAvg puro (a média de dois níveis telescopa)"}], "strategy_en": "Grouped FedAvg"}, "summary": "Cada grupo pesa proporcionalmente aos exemplos que trouxe. Esta média de dois níveis telescopa: o resultado é idêntico ao FedAvg puro, e serve aqui como linha de base contra o peso igual.", "notes": [{"title": "Esta simulação é FedAvg puro, com outro nome", "title_en": "This simulation is plain FedAvg under another name", "body": "A agregação em dois níveis com peso proporcional aos exemplos <b>telescopa<\/b>: o <code>N_g<\/code> que pondera o grupo cancela com o <code>N_g<\/code> que normaliza a média dentro dele, e sobra a média ponderada de todos os clients — que é o FedAvg puro. Agrupar aqui é apenas colocar parênteses numa soma. Verificado numericamente (<code>1e-16<\/code>) e rodando o treino inteiro com a mesma semente (idêntico até a última casa). Então <b>não espere<\/b> que esta simulação difira das outras marcadas com o mesmo <i>equivale a<\/i>: quando diferem, a diferença é ruído de execução, não método.", "body_en": "Two-level aggregation with example-proportional weights <b>telescopes<\/b>: the <code>N_g<\/code> weighting the group cancels the <code>N_g<\/code> normalizing the mean inside it, leaving the example-weighted mean over all clients — which is plain FedAvg. Grouping here is just putting parentheses around a sum. Verified numerically (<code>1e-16<\/code>) and by running the full training with the same seed (identical to the last digit). So <b>do not expect<\/b> this simulation to differ from the others tagged with the same <i>equivalent to<\/i>: when they differ, the difference is run-to-run noise, not method."}, {"title": "O que estamos testando: quanto cada grupo pesa", "body": "Os 10 clients estão repartidos em 4 grupos fixos — <code>[2,3,7]<\/code>, <code>[5,6,8]<\/code>, <code>[4,9]<\/code>, <code>[0,1]<\/code>. O modelo global sai de uma média em dois níveis: primeiro os clients viram um modelo por grupo, depois os grupos viram o modelo global. A pergunta é <b>quanto cada grupo pesa nessa segunda etapa<\/b>, e há duas respostas possíveis. Estas simulações rodam as duas, com a mesma semente, os mesmos dados e os mesmos clients sorteados — para que a única diferença seja o peso."}, {"title": "Peso por exemplos: agrupar é só colocar parênteses", "body": "Se cada grupo pesa o total de exemplos que trouxe, a conta se desfaz. Dentro do grupo, a média divide por <code>N_g<\/code>, o total de exemplos dele; entre grupos, multiplica por <code>N_g<\/code> de novo. Os dois se cancelam, e sobra a média ponderada de todos os clients — que é exatamente o FedAvg puro. É a diferença entre <code>(a+b) + (c+d)<\/code> e <code>a+b+c+d<\/code>: <b>parênteses não mudam uma soma<\/b>. Confirmamos isso de duas formas em 07/09/2026: pela álgebra (diferença de <code>1e-16<\/code>) e rodando o treino inteiro (idêntico até a última casa). Nesse modo o agrupamento aparece no log e não move o modelo."}, {"title": "Peso igual: quando o grupo passa a significar algo", "body": "Se todo grupo pesa <code>1<\/code>, o <code>N_g<\/code> não cancela mais e o modelo global muda de verdade. Um grupo com 500 exemplos passa a influenciar tanto quanto um com 12.000. É o que dá sentido a grupo como <b>unidade real<\/b> — região, hospital, operadora — em vez de rótulo. E ataca um problema concreto destes dados: no Stack Exchange um único autor detém 54% dos exemplos e, sob peso por exemplos, arrasta o modelo global sozinho; sob peso igual, ele fica limitado à fatia do grupo dele."}, {"title": "Grupo vazio: um detalhe que muda de importância", "body": "O sorteio de clients ignora os grupos. Com 7 de 10 sorteados, algum grupo fica sem ninguém em <b>15% dos rounds<\/b> — número que calculamos exato e que bateu com os 12 de 80 rounds medidos. Um grupo de 2 clients fica vazio oito vezes mais que um de 3, então grupos desiguais são desigualmente frágeis. Sob peso por exemplos isso não muda nada (grupo vazio tem peso zero dos dois lados da conta). Sob <b>peso igual<\/b>, muda: com 4 grupos e um vazio, os três restantes sobem de <code>1/4<\/code> para <code>1/3<\/code> cada. O grupo ausente passa a redistribuir influência."}, {"title": "Como ler a comparação", "body": "Cada simulação de peso igual tem como referência a de peso por exemplos na mesma fração — é a linha tracejada laranja dos gráficos e a segunda coluna da tabela de comparação. Como as duas são semeadas e partem dos mesmos pesos iniciais, <b>qualquer diferença é do peso<\/b>, não de sorte. Não há mais margem de ruído a descontar: se as curvas se separam, o agrupamento está fazendo alguma coisa."}], "label_en": "FedAvg, example-weighted — partial 0.7 · seeded", "summary_en": "Each group weighs in proportion to the examples it contributed. This two-level mean telescopes: the result is identical to plain FedAvg, and it serves here as the baseline against equal weighting.", "runs": [{"id": "cifar10-pretrained", "origin": "pretrained", "label": "CIFAR-10 — ResNet-18 congelada", "metric": "Accuracy de classificação (10 classes)", "chance": 0.1, "csv": "fl_results_2026_09_08_105322.csv", "eval_set": "1.000 imagens (MAX_CENTRALIZED_IMAGES = 1000)", "hyper": {"Modelo": "ResNet-18 da torchvision congelada (11,2M pesos, em eval, sem a cabeça ImageNet) → features 512-d normalizadas em L2 → head treinável nn.Linear(512, 10)", "Pesos iniciais": "ResNet18_Weights.IMAGENET1K_V1 (backbone) · ning": 0, "interrupted": 0, "pending": 0, "planned": 0}, "state": "done"}, {"id": "seed-partial07-equal", "grupo": "experimento", "label": "Grupos com peso igual — parcial 0,7 · semeado", "compare_to": "seed-partial07-examples", "config": {"clients": 10, "rounds": 20, "groups": 4, "fraction_train": 0.7, "fraction_evaluate": 0.7, "strategy": "Grouped FedAvg", "seed": 42, "extra": [{"k": "peso grupo→global", "v": "igual", "k_en": "group→global weight", "v_en": "equal"}, {"k": "min-train-nodes", "v": "7", "k_en": "min-train-nodes", "v_en": "7"}, {"k": "determinismo", "v": "semeado (seed 42)", "k_en": "determinism", "v_en": "seeded (seed 42)"}, {"k": "algoritmo efetivo", "v": "≠ FedAvg puro — o único algoritmo genuinamente diferente", "k_en": "algoritmo efetivo", "v_en": "≠ FedAvg puro — o único algoritmo genuinamente diferente"}], "strategy_en": "Grouped FedAvg"}, "summary": "Cada grupo pesa o mesmo na agregação grupo→global, independentemente de quantos dados tem. É a configuração em que o agrupamento deixa de ser contabilidade e passa a mudar o modelo.", "notes": [{"title": "O que estamos testando: quanto cada grupo pesa", "body": "Os 10 clients estão repartidos em 4 grupos fixos — <code>[2,3,7]<\/code>, <code>[5,6,8]<\/code>, <code>[4,9]<\/code>, <code>[0,1]<\/code>. O modelo global sai de uma média em dois níveis: primeiro os clients viram um modelo por grupo, depois os grupos viram o modelo global. A pergunta é <b>quanto cada grupo pesa nessa segunda etapa<\/b>, e há duas respostas possíveis. Estas simulações rodam as duas, com a mesma semente, os mesmos dados e os mesmos clients sorteados — para que a única diferença seja o peso."}, {"title": "Peso por exemplos: agrupar é só colocar parênteses", "body": "Se cada grupo pesa o total de exemplos que trouxe, a conta se desfaz. Dentro do grupo, a média divide por <code>N_g<\/code>, o total de exemplos dele; entre grupos, multiplica por <code>N_g<\/code> de novo. Os dois se cancelam, e sobra a média ponderada de todos os clients — que é exatamente o FedAvg puro. É a diferença entre <code>(a+b) + (c+d)<\/code> e <code>a+b+c+d<\/code>: <b>parênteses não mudam uma soma<\/b>. Confirmamos isso de duas formas em 07/09/2026: pela álgebra (diferença de <code>1e-16<\/code>) e rodando o treino inteiro (idêntico até a última casa). Nesse modo o agrupamento aparece no log e não move o modelo."}, {"title": "Peso igual: quando o grupo passa a significar algo", "body": "Se todo grupo pesa <code>1<\/code>, o <code>N_g<\/code> não cancela mais e o modelo global muda de verdade. Um grupo com 500 exemplos passa a influenciar tanto quanto um com 12.000. É o que dá sentido a grupo como <b>unidade real<\/b> — região, hospital, operadora — em vez de rótulo. E ataca um problema concreto destes dados: no Stack Exchange um único autor detém 54% dos exemplos e, sob peso por exemplos, arrasta o modelo global sozinho; sob peso igual, ele fica limitado à fatia do grupo dele."}, {"title": "Grupo vazio: um detalhe que muda de importância", "body": "O sorteio de clients ignora os grupos. Com 7 de 10 sorteados, algum grupo fica sem ninguém em <b>15% dos rounds<\/b> — número que calculamos exato e que bateu com os 12 de 80 rounds medidos. Um grupo de 2 clients fica vazio oito vezes mais que um de 3, então grupos desiguais são desigualmente frágeis. Sob peso por exemplos isso não muda nada (grupo vazio tem peso zero dos dois lados da conta). Sob <b>peso igual<\/b>, muda: com 4 grupos e um vazio, os três restantes sobem de <code>1/4<\/code> para <code>1/3<\/code> cada. O grupo ausente passa a redistribuir influência."}, {"title": "Como ler a comparação", "body": "Cada simulação de peso igual tem como referência a de peso por exemplos na mesma fração — é a linha tracejada laranja dos gráficos e a segunda coluna da tabela de comparação. Como as duas são semeadas e partem dos mesmos pesos iniciais, <b>qualquer diferença é do peso<\/b>, não de sorte. Não há mais margem de ruído a descontar: se as curvas se separam, o agrupamento está fazendo alguma coisa."}], "label_en": "Equal-weight groups — partial 0.7 · seeded", "summary_en": "Every group weighs the same in the group→global step, regardless of how much data it holds. This is the setting where grouping stops being bookkeeping and starts changing the model.", "runs": [{"id": "cifar10-pretrained", "origin": "pretrained", "label": "CIFAR-10 — ResNet-18 congelada", "metric": "Accuracy de classificação (10 classes)", "chance": 0.1, "csv": "fl_results_2026_09_08_110218.csv", "eval_set": "1.000 imagens (MAX_CENTRALIZED_IMAGES = 1000)", "hyper": {"Modelo": "ResNet-18 da torchvision congelada (11,2M pesos, em eval, sem a cabeça ImageNet) → features 512-d normalizadas em L2 → head treinável nn.Linear(512, 10)", "Pesos iniciais": "ResNet18_Weights.IMAGENET1K_V1 (backbone) · head aleatório", "Otimizador": "SGD, momentum 0,9", "Learning rate": "1,0", "Batch size": "32", "Épocas locais": "1", "Dados por client": "500 imagens (MAX_IMAGES_PER_CLIENT)", "Particionamento": "IID (IidPartitioner)", "Pré-processamento": "Resize 224 · Normalize ImageNet (0,485/0,456/0,406)", "Comunicado por round": "5.130 pesos — só o head linear"}, "queued": true, "label_en": "CIFAR-10 — frozen ResNet-18", "metric_en": "Classification accuracy (10 classes)", "eval_set_en": "1,000 images (MAX_CENTRALIZED_IMAGES = 1000)", "hyper_en": {"Model": "torchvision ResNet-18, frozen (11.2M weights, in eval, ImageNet head removed) → L2-normalized 512-d features → trainable nn.Linear(512, 10) head", "Initial weights": "ResNet18_Weights.IMAGENET1K_V1 (backbone) · random head", "Optimizer": "SGD, momentum 0.9", "Learning rate": "1.0", "Batch size": "32", "Local epochs": "1", "Data per client": "500 images (MAX_IMAGES_PER_CLIENT)", "Partitioning": "IID (IidPartitioner)", "Preprocessing": "Resize 224 · ImageNet Normalize (0.485/0.456/0.406)", "Communicated per round": "5,130 weights — the linear head only"}, "status": "done", "rows": [{"round": 0, "accuracy": 0.12, "loss": 2.30098,
